<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARENA — Rogue (action roguelike skeleton)</title>
<style>
  * { margin:0; box-sizing:border-box }
  html,body { height:100%; overflow:hidden; background:#07090f; color:#dfe6f0;
              font-family:"Segoe UI",system-ui,sans-serif; user-select:none }
  #c { position:fixed; inset:0; display:block; cursor:crosshair }
  .ov { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:5 }
  .card { position:relative; background:#0d1322f2; border:1px solid #233047; border-radius:16px;
          padding:26px 30px; max-width:660px; text-align:center }
  h1 { font-size:34px; letter-spacing:6px; color:#e6edf3 }
  .sub { color:#8b949e; font-size:13px; margin:6px 0 18px }
  .clsRow { display:flex; gap:12px; justify-content:center; flex-wrap:wrap }
  .cls { background:#101a2e; border:1px solid #2b3a55; border-radius:14px; padding:14px 18px;
         color:#dfe6f0; cursor:pointer; font-size:15px; font-weight:600; min-width:170px }
  .cls:hover { border-color:#58a6ff; background:#14213a }
  .cls .big { font-size:30px; margin-bottom:6px }
  .cls .d { font-size:11px; color:#8b949e; font-weight:400; margin-top:5px }
  .ctrl { font-size:12px; color:#8b949e; margin-top:18px; line-height:1.9 }
  .ctrl b { color:#dfe6f0 }
  #langBtn { position:absolute; top:14px; right:14px; background:#101a2e; color:#8b949e;
             border:1px solid #2b3a55; border-radius:8px; padding:4px 10px; font-size:11px; cursor:pointer }
  #langBtn:hover { color:#dfe6f0; border-color:#58a6ff }
  #hudTop { position:fixed; top:10px; left:10px; right:10px; z-index:3; display:flex;
           justify-content:space-between; pointer-events:none }
  .b { background:#0d1322cc; border:1px solid #233047; border-radius:12px; padding:9px 14px }
  #statL { font-size:11px; color:#8b949e; line-height:1.9 }
  #statL b { color:#dfe6f0 }
  #statR { text-align:right; font-size:12px; color:#8b949e; line-height:1.8 }
  #statR b { color:#dfe6f0 }
  /* enemy inspector — pinned to the top-centre, appears when the crosshair is on a foe */
  #inspect { position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:4;
            width:300px; background:#0d1322e6; border:1px solid #2b3a55; border-radius:12px;
            padding:9px 12px; pointer-events:none; display:none; box-shadow:0 6px 24px rgba(0,0,0,.5) }
  #inspect .row { display:flex; align-items:center; gap:8px }
  #inspect .nm { font-weight:700; font-size:14px; color:#e6edf3; letter-spacing:.4px }
  #inspect .rar { font-size:9px; font-weight:700; letter-spacing:.6px; padding:2px 7px;
                  border-radius:99px; border:1px solid currentColor }
  #inspect .hpwrap { flex:1; height:9px; background:#0a0f1a; border-radius:99px; overflow:hidden;
                     border:1px solid #22304a; position:relative }
  #inspect .hpfill { height:100%; background:linear-gradient(90deg,#e05252,#ff8a8a); transition:width .08s linear }
  #inspect .lbl { font-size:9px; color:#8b949e; letter-spacing:1px; width:44px; flex:0 0 44px }
  #inspect .line { font-size:11px; color:#9aa4b2; margin-top:6px; display:flex; gap:12px; flex-wrap:wrap }
  #inspect .line .k { color:#6b7484; font-size:9px; letter-spacing:.5px; text-transform:uppercase }
  #inspect .line b { color:#dfe6f0; font-weight:700 }
  #inspect .sw { margin-top:7px; display:flex; gap:10px; font-size:11px; align-items:center }
  #inspect .sw .tag { display:inline-block; min-width:26px; text-align:center; font-size:9px; font-weight:800;
                      letter-spacing:.5px; padding:2px 6px; border-radius:6px }
  #inspect .tag.weak { color:#7ee787; background:rgba(126,231,135,.15); border:1px solid rgba(126,231,135,.4) }
  #inspect .tag.strong { color:#ff9f43; background:rgba(255,159,67,.15); border:1px solid rgba(255,159,67,.4) }
  #inspect .sw .el { font-weight:700 }
  #bottomCenter { position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
                  z-index:3; display:flex; flex-direction:column; gap:5px; align-items:center }
  .bar { width:300px; height:15px; background:#0a0f1a; border:1px solid #22304a;
         border-radius:99px; overflow:hidden; position:relative }
  .bar i { display:block; height:100%; width:100%; transition:width .08s linear }
  .bar.hp i { background:linear-gradient(90deg,#e05252,#ff8a8a) }
  .bar.xp i { background:linear-gradient(90deg,#2f6fd0,#58a6ff) }
  .bar .lab { position:absolute; left:8px; top:0; font-size:9px; line-height:15px; color:#e6edf3;
              text-shadow:0 1px 2px #000 }
  #lvlTag { font-size:11px; color:#8b949e }
  #slots { position:fixed; left:10px; bottom:10px; z-index:3; display:flex; gap:8px }
  .slot { display:flex; gap:7px; align-items:center; width:150px; min-height:46px; background:#0d1322cc;
          border:1px solid #233047; border-radius:10px; padding:5px 8px; font-size:10px; line-height:1.3; color:#8b949e }
  .slot b { display:block; font-size:10px; color:#dfe6f0; white-space:nowrap }
  .slotIcon { width:30px; height:30px; flex:0 0 auto; border-radius:6px; background:#0a0f1e; border:1px solid #1a2233 }
  #abs { position:fixed; right:10px; bottom:58px; z-index:3; display:flex; gap:8px }
  #attrB { display:flex; gap:7px; align-items:center }
  #attrB .aph { font-size:11px; color:#8b949e; letter-spacing:1px }
  #attrB .aph b { color:#ffd23f; font-size:14px; margin-left:2px }
  .abtn { pointer-events:auto; background:#101a2e; border:1px solid #2b3a55; border-radius:8px;
         color:#dfe6f0; font-size:11px; font-weight:700; letter-spacing:.5px; padding:4px 8px; cursor:pointer }
  .abtn i { font-style:normal; font-weight:400; color:#8b949e; margin-left:3px }
  .abtn.ready { border-color:#7ee787; box-shadow:0 0 8px rgba(126,231,135,.3) }
  .abtn.ready i { color:#7ee787 }
  .ahint { font-size:9px; color:#5d6675 }
  .ab { width:52px; height:52px; background:#0d1322cc; border:1px solid #233047; border-radius:10px;
        position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center;
        font-size:20px; color:#dfe6f0 }
  .wbtn { pointer-events:auto; background:#101a2e; border:1px solid #2b3a55; border-radius:9px;
         color:#dfe6f0; font-size:11px; font-weight:700; letter-spacing:.5px; padding:5px 12px;
         cursor:pointer; margin-bottom:4px }
  .wbtn:hover { border-color:#58a6ff; background:#14213a }
  .wbtn.cool { opacity:.45; cursor:default }
  .wbtn.cool:hover { border-color:#2b3a55; background:#101a2e }
  #shop { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:9; width:430px;
          background:#0d1322ee; border:1px solid #2b3a55; border-radius:14px; padding:14px 16px;
          color:#dfe6f0; max-height:82vh; overflow:auto }
  #shop h3 { margin:0 0 2px; font-size:15px; color:#ffd23f }
  #shop .who { font-size:11px; color:#8b949e; margin-bottom:10px }
  #shop .who b { color:#7ee787 }
  #shop .grp { font-size:10px; letter-spacing:1px; color:#58a6ff; margin:10px 0 5px }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px;
          background:#101a2e; border:1px solid #23304a; border-radius:9px; padding:7px 9px; margin-bottom:6px }
  .srow .info { font-size:11px; line-height:1.3; min-width:0; flex:1 }
  .srow .info b { display:block; font-size:11px }
  .srow .info span { color:#8b949e; font-size:10px }
  .buy { pointer-events:auto; background:#16324f; border:1px solid #58a6ff; border-radius:8px;
         color:#dfe6f0; font-size:11px; font-weight:700; padding:6px 10px; cursor:pointer; white-space:nowrap }
  .buy:disabled { opacity:.35; cursor:default }
  .buy.no { background:#3a1a22; border-color:#e05252; color:#ff8a8a }
  #shopClose { position:absolute; top:10px; right:12px; background:none; border:none; color:#8b949e;
               font-size:16px; cursor:pointer }
  /* ---- character sheet (C) ---- */
  #char { position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center;
          background:rgba(5,8,16,.55) }
  #char .card { position:relative; background:#0d1322f5; border:1px solid #2b3a55; border-radius:16px;
                width:560px; max-width:94vw; max-height:88vh; overflow:auto; padding:18px 20px; color:#dfe6f0 }
  #char h3 { margin:0 0 2px; font-size:18px; color:#ffd23f; letter-spacing:.5px }
  #char .who { font-size:12px; color:#8b949e; margin-bottom:12px }
  #char .who b { color:#dfe6f0 }
  #char .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px }
  #char .box { background:#101a2e; border:1px solid #23304a; border-radius:11px; padding:10px 12px }
  #char .box h4 { margin:0 0 7px; font-size:10px; letter-spacing:1px; color:#58a6ff; text-transform:uppercase }
  #char .kv { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:2px 0 }
  #char .kv span { color:#8b949e }
  #char .kv b { color:#dfe6f0; font-weight:700 }
  #char .kv b.pos { color:#7ee787 }
  #char .close { position:absolute; top:12px; right:14px; background:none; border:none; color:#8b949e;
                 font-size:18px; cursor:pointer }
  #char .close:hover { color:#dfe6f0 }
  #cmp { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:10; width:480px;
         background:#0d1322ee; border:1px solid #2b3a55; border-radius:14px; padding:16px 18px; color:#dfe6f0 }
  #cmp h3 { margin:0 0 2px; font-size:16px; color:#e6edf3 }
  #cmp .who { font-size:11px; color:#8b949e; margin-bottom:12px }
  #cmpRow { display:flex; gap:10px; align-items:stretch }
  .cpc { flex:1; background:#101a2e; border:1px solid #23304a; border-radius:10px; padding:10px 12px; min-height:74px }
  .cpc-tag { font-size:10px; letter-spacing:.5px; margin-bottom:4px; font-weight:700 }
  .cpc-name { font-size:13px; font-weight:700; margin-bottom:5px; line-height:1.3 }
  .cpc-stat { font-size:11px; color:#8b949e; line-height:1.5 }
  .cmpVS { align-self:center; font-size:18px; color:#58a6ff; font-weight:700 }
  .cmpBtns { display:flex; gap:10px; margin-top:14px }
  .cbtn { flex:1; pointer-events:auto; border-radius:9px; padding:9px 12px; font-size:12px; font-weight:700;
          cursor:pointer; letter-spacing:.3px }
  .cbtn.new { background:#16324f; border:1px solid #58a6ff; color:#dfe6f0 }
  .cbtn.new:hover { background:#1f4468 }
  .cbtn.old { background:#3a1a22; border:1px solid #e05252; color:#ff8a8a }
  .cbtn.old:hover { background:#4a2029 }
  .ab .k { position:absolute; top:2px; left:5px; font-size:9px; color:#8b949e }
  .ab .cd { position:absolute; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center;
            justify-content:center; font-size:14px; color:#ffd23f }
  #mini { position:fixed; right:10px; bottom:122px; z-index:3; background:#0d1322cc;
          border:1px solid #233047; border-radius:10px }
  #up .card { border-color:#3a4a6a }
  #upT { font-size:17px; margin-bottom:14px }
  #upCards { display:flex; gap:12px; justify-content:center }
  .upc { background:#101a2e; border:1px solid #2b3a55; border-radius:12px; padding:14px;
         min-width:170px; cursor:pointer; color:#dfe6f0; font-size:13px }
  .upc:hover { border-color:#58a6ff }
  .upc b { display:block; margin-bottom:6px; font-size:14px; color:#7ee787 }
  .upc span { color:#8b949e; font-size:11px }
  #end h2 { font-size:26px; margin-bottom:8px }
  #endStats { font-size:13px; color:#8b949e; line-height:1.9; margin-bottom:14px }
  #endStats b { color:#dfe6f0 }
  #end .btnRow { display:flex; gap:10px; justify-content:center }
  .btn { background:#166534; border:1px solid #2ea043; color:#fff; padding:9px 18px;
         border-radius:10px; cursor:pointer; font-size:13px }
  .btn.ghost { background:transparent; border-color:#233047; color:#8b949e }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ov" style="display:flex">
  <div class="card" style="max-width:720px">
    <button id="langBtn">PT / EN</button>
    <h1>ARENA</h1>
    <div class="sub" id="tSub"></div>
    <div class="clsRow">
      <button class="cls" id="clDag"><div class="big"><canvas id="clDagC" width="64" height="64"></canvas></div><span id="tDag"></span><div class="d" id="tDagD"></div></button>
      <button class="cls" id="clXbow"><div class="big"><canvas id="clXbowC" width="64" height="64"></canvas></div><span id="tXbow"></span><div class="d" id="tXbowD"></div></button>
      <button class="cls" id="clMag"><div class="big"><canvas id="clMagC" width="64" height="64"></canvas></div><span id="tMag"></span><div class="d" id="tMagD"></div></button>
    </div>
    <div class="ctrl" id="tCtrl"></div>
  </div>
</div>

<div id="hudTop" style="display:none">
  <div class="b" id="statL"></div>
  <div class="b" id="attrB">
    <span class="aph">PTS <b id="aPts">0</b></span>
    <button class="abtn" id="bSTR">STR <i id="vSTR">0</i></button>
    <button class="abtn" id="bDEX">DEX <i id="vDEX">0</i></button>
    <button class="abtn" id="bEND">END <i id="vEND">0</i></button>
    <span class="ahint" id="attrHint"></span>
  </div>
  <div class="b" id="statR"></div>
</div>
<div id="inspect">
  <div class="row">
    <span class="nm" id="inNm">—</span>
    <span class="rar" id="inRar">—</span>
    <div class="hpwrap"><div class="hpfill" id="inHpF"></div></div>
  </div>
  <div class="line">
    <span class="k" id="inHpK">HP</span><b id="inHp">0/0</b>
    <span class="k" id="inDefK">DEF</span><b id="inDef">0</b>
  </div>
  <div class="line">
    <span class="k" id="inWeakK"></span><span id="inWeak" class="el">—</span>
    <span class="k" id="inStrongK"></span><span id="inStrong" class="el">—</span>
  </div>
</div>
<div id="bottomCenter" style="display:none">
  <button id="waveNext" class="wbtn" style="display:none"></button>
  <div class="bar hp"><i id="hpF"></i><span class="lab" id="hpLab"></span></div>
  <div class="bar xp"><i id="xpF"></i><span class="lab" id="xpLab"></span></div>
  <div id="lvlTag"></div>
</div>
<div id="slots" style="display:none">
  <div class="slot" id="sl0"><canvas class="slotIcon" width="40" height="40"></canvas><b>—</b>—</div>
  <div class="slot" id="sl1"><canvas class="slotIcon" width="40" height="40"></canvas><b>—</b>—</div>
  <div class="slot" id="sl2"><canvas class="slotIcon" width="40" height="40"></canvas><b>—</b>—</div>
  <div class="slot" id="sl3"><canvas class="slotIcon" width="40" height="40"></canvas><b>—</b>—</div>
</div>
<div id="abs" style="display:none">
  <div class="ab" id="ab0"><span class="k">1</span>⚔<span class="cd"></span></div>
  <div class="ab" id="ab1"><span class="k">2</span>❖<span class="cd"></span></div>
  <div class="ab" id="ab2"><span class="k">3</span>✦<span class="cd"></span></div>
</div>
<canvas id="mini" width="140" height="140" style="display:none"></canvas>

<div id="up" class="ov">
  <div class="card">
    <div id="upT"></div>
    <div id="upCards"></div>
  </div>
</div>

<div id="shop" style="display:none">
  <button id="shopClose">✕</button>
  <h3 id="shopTitle"></h3>
  <div class="who" id="shopWho"></div>
  <div id="shopRows"></div>
</div>

<div id="cmp" style="display:none">
  <h3 id="cmpTitle"></h3>
  <div class="who" id="cmpSub"></div>
  <div id="cmpRow"></div>
  <div class="cmpBtns">
    <button class="cbtn old" id="cmpOld"></button>
    <button class="cbtn new" id="cmpNew"></button>
  </div>
</div>

<div id="end" class="ov">
  <div class="card">
    <h2 id="endTitle"></h2>
    <div id="endStats"></div>
    <div class="btnRow">
      <button class="btn" id="endAgain"></button>
      <button class="btn ghost" id="endMenu"></button>
    </div>
  </div>
</div>

<div id="pause" class="ov" style="display:none">
  <div class="card" style="width:380px; padding:22px 26px">
    <h2 id="pauseTitle" style="color:#ffd23f"></h2>
    <div style="display:flex; flex-direction:column; gap:10px; margin:16px 0 4px">
      <button class="btn" id="pauseResume"></button>
      <button class="btn ghost" id="pauseMenu"></button>
    </div>
    <div style="border-top:1px solid #233047; margin-top:18px; padding-top:14px">
      <div style="font-size:12px; font-weight:700; letter-spacing:1px; color:#58a6ff; margin-bottom:10px" id="pauseOptH"></div>
      <div style="display:flex; align-items:center; gap:10px">
        <span style="font-size:12px; color:#8b949e; width:56px; flex:0 0 56px" id="pauseAudioLbl"></span>
        <input type="range" id="pauseVol" min="0" max="100" step="1" value="100"
               style="flex:1; accent-color:#58a6ff; cursor:pointer">
        <button class="btn ghost" id="pauseMute" style="padding:4px 10px; font-size:11px"></button>
      </div>
    </div>
  </div>
</div>

<div id="char">
  <div class="card">
    <button class="close" id="charClose" title="C">×</button>
    <h3 id="charTitle"></h3>
    <div class="who" id="charWho"></div>
    <div class="grid" id="charGrid"></div>
  </div>
</div>

<script>'use strict';
/* =========================================================
   ARENA — action roguelike skeleton (2D top-down)
   Canvas + WebAudio, zero deps, runs in file://
   Rogue dual-wield · waves · rarity · scaling XP ·
   rarity-based loot (prefix/suffix, PoE-style) · abilities
========================================================= */

  u_soul:'Soul Bolts', u_soul_d:'+6% lifesteal on hit.',

  u_luck:'Lucky Quiver', u_luck_d:'+15% XP.',

  u_cut:'Cutting Arrows', u_cut_d:'Hits apply a 3s bleed: 20% of the hit as damage/sec (scales with level).',
  u_burn:'Ember Tips', u_burn_d:'Hits apply a 3s burn: 15% of the hit as damage/sec (scales with level).',
  u_frost:'Frost Arrows', u_frost_d:'Hits apply a 3s chill: 8% of the hit as damage/sec + 40% slow (scales with level).',
  u_magepen:'Arcane Penetration', u_magepen_d:'Spells ignore up to 60% of target armor & resistances (15% per stack). Your answer to later walls.',

function zoneForWave(w){ return w>=ZONE_SWITCH.z3 ? 2 : (w>=ZONE_SWITCH.z2 ? 1 : 0); }

function generateOBBs(zone) {
  const out=[], cx=WORLD.w/2, cy=WORLD.h/2; let guard=0;
  const kinds = zone===0 ? ['tree','tree','rocha']
              : zone===1 ? ['wall','wall','caixa']
              :            ['bone','bone','wall'];
  const n = zone===1 ? 26 : zone===0 ? 18 : 24;    // the ruins are denser
  while (out.length<n && guard++<900) {
    const w=R(60,150), h=R(60,150), x=R(60,WORLD.w-60-w), y=R(60,WORLD.h-60-h);
    if (x+w>cx-260 && x<cx+260 && y+h>cy-260 && y<cy+260) continue;
    if (out.some(o=> x<o.x+o.w+90 && x+w>o.x-90 && y<o.y+o.h+90 && y+h>o.y-90)) continue;
    out.push({ x, y, w, h, kind: kinds[RI(kinds.length)] });
  }
  return out;
}
/* dungeon spike traps: sit still, deal a hit + re-arm every `cool` s */
function generateTraps(zone){
  if (zone!==1) return [];
  const out=[]; let guard=0;
  while (out.length<10 && guard++<400){
    const x=R(120,WORLD.w-120), y=R(120,WORLD.h-120);
    if (Math.abs(x-WORLD.w/2)<220 && Math.abs(y-WORLD.h/2)<220) continue;   // keep the center open
    if (out.some(o=>Math.hypot(o.x-x,o.y-y)<170)) continue;
    out.push({ x, y, r:44, cd:0, flash:0 });
  }
  return out;
}
/* hell fissures: glowing cracks that vent elite+ mobs up from the ground */
function generateFissures(zone){
  if (zone!==2) return [];
  const out=[]; let guard=0;
  while (out.length<6 && guard++<400){
    const x=R(150,WORLD.w-150), y=R(150,WORLD.h-150);
    if (Math.abs(x-WORLD.w/2)<280 && Math.abs(y-WORLD.h/2)<280) continue;
    out.push({ x, y, ang:R(0,TAU), len:R(120,260), cd:R(4,9), pulse:0 });
  }
  return out;
}

   dungeon pillars, hell bone-ribs & lava pools */

      kind:RI(3), h:R(50,90), glow:R(0,TAU)});
  }

}

/* Move to a zone (0 meadow / 1 dungeon / 2 hell): regenerate the arena,
   traps, fissures and decor. announce=false silences the banner (run start). */
function switchZone(n, announce) {
  announce = (announce!==false);
  G.zone = n;
  OBB = generateOBBs(n);
  G.traps = generateTraps(n);
  G.fissures = generateFissures(n);
  G.decor = generateDecor(n);
  if (announce) {
    G.zoneFlash = 3;
    addFloat(G.p.x, G.p.y-48, t(ZONES[n].key), ZONES[n].base==='#130a0a' ? '#ff6a3d' : ZONES[n].base==='#0c0f16' ? '#58a6ff' : '#7ee787');
  }
}

function spendAttr(k) {
  if (!G || G.attrPts <= 0) return;
  G.attrPts--;
  if (k === 'str') G.attr.str++;
  else if (k === 'dex') G.attr.dex++;
  else { G.attr.end++; G.p.hp = Math.min(maxHp(), G.p.hp + 4); }
  hud();
}

   precedes a boss wave. He vanishes the moment the boss drops. */
function rollShopStock() {
  // one item per rarity in SHOP.stock, each a real drop of that rarity
  const cx = G.cat.x || SHOP.x, cy = G.cat.y || SHOP.y;
  const prevBest = G.bestItem;            // vendor stock must not become "your best loot"

function snapCatToCenter() {
  // Mog sits in the middle of the arena (the OBB-free center by construction),
  // with a fallback to the first clear spot if anything is ever blocking it.
  const cx = WORLD.w/2, cy = WORLD.h/2;
  const blocked = x => y => OBB.some(o => x > o.x-40 && x < o.x+o.w+40 && y > o.y-40 && y < o.y+o.h+40);
  if (!blocked(cx)(cy)) return { x:cx, y:cy };
  // nudge toward a clear spot around the center
  for (let r = 40; r <= 260; r += 40)
    for (let a = 0; a < TAU; a += Math.PI/8) {
      const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      if (!blocked(x)(y)) return { x, y };
    }
  return { x:cx, y:cy };
}

/* ---------------- derived stats (affix-based) ---------------- */
function itemBonus(stat) {
  let s = 0;
  for (const slot of ['weaponL','weaponR','armor','amulet']) {
    const it = G.items[slot];
    if (it && it.affixes) for (const a of it.affixes) if (a.stat === stat) s += a.val;
  }
  return s;
}
/* ---------------- UNIQUE-item effect hooks ----------------
   A unique is recognised by the ukey marker on the equipped weapon. Numeric
   stats (flat/atk/crit/pen/dmg) flow through itemBonus() like any affix; only
   the QUALITATIVE effects (fire conversion, pierce, chain, meteor) are keyed. */
function uniqOn(key) { const it = G && G.items && G.items.weaponL; return !!(it && it.ukey === key); }
function uniqDef(key) { return uniqOn(key) ? CFG.uniques[key] : null; }
/* any-slot check (dagger uniques live in either hand) */
function uniqAny(key){ for (const s of ['weaponL','weaponR']) { const it = G && G.items && G.items[s]; if (it && it.ukey === key) return true; } return false; }
/* the equipped crossbow unique's bolt modifiers (ice / fire / pierce / detonate / +bolt) */
function uniqBoltMods(){
  const it = G && G.items && G.items.weaponL; if (!it || !it.ukey) return null;
  const U = CFG.uniques[it.ukey]; if (!U) return null;
  return { iceBolt:!!U.iceBolt, fireBolt:!!U.fireBolt, boltPierce:U.boltPierce||0,
           boltDetonate:U.boltDetonate||null, extraBolt:U.extraBolt||0 };
}
/* flat +atk from the daggers' "Runic" affix */
function uniqueFlatAtk() { return itemBonus('flat'); }
/* defense-ignored % from the daggers' "Breach" affix (20% of armor+resist) */
function uniqueDefIgnored() { return itemBonus('pen')/100; }
function uniqueFireConv() { return uniqOn('u_dagger') && !!(CFG.uniques.u_dagger.fireConv); }
function uniqueBoltPierce() { const j = uniqDef('u_jaws'); return j ? (j.boltPierce||0) : 0; }
function uniqueCritShards() { const j = uniqDef('u_jaws'); return j ? (j.critShards||0) : 0; }
/* mage "Trinity" staff: an enemy pierced by ice in the last 5s = +20% mage dmg, up to 100% */
function iceBuffsActive() { let n=0; for (const m of G.mobs) if (m.iceT > 0) n++; return n; }
function iceDmgMult() {
  if (!uniqOn('u_staff')) return 1;
  const cap = CFG.uniques.u_staff.iceStacks;
  return 1 + cap.per * Math.min(cap.cap, iceBuffsActive());
}
/* ---------------- NEW affix effects (all rarities, via itemBonus) ----------------
   These are the special-effect affixes the loot rework adds. Each is summed from the
   equipped gear (like dmg/crit/atk) and applied at the relevant combat step. */
/* elemental damage affixes are now FLAT points ("+X fire/cold/volt"), added
   on top of the physical base as their own damage type. */
function elFlat(el){ return Math.round(itemBonus(el+'Dmg')); }   // el: 'fire'|'cold'|'volt'
/* which elemental bonuses a given hit feeds: an elemental spell feeds ONLY its
   own element ("fireball doesn't grow from cold affixes"); a physical hit
   feeds the whole pool (fire + cold + volt). */
function elPairs(elem) {
  if (elem !== 'phys') return elFlat(elem) > 0 ? [{ el: elem, v: elFlat(elem) }] : [];
  const out = [];
  for (const el of ['fire','cold','volt']) if (elFlat(el) > 0) out.push({ el, v: elFlat(el) });
  return out;
}
const EL_COL = { fire:'#ff9f43', cold:'#58a6ff', volt:'#b18cff' };  // volt = ball-lightning purple
function extraProj(){ return Math.max(0, Math.floor(itemBonus('proj'))); }
function igniteChance(){ return Math.min(.9, itemBonus('ignite')/100); }
function lifestealPct(){ return Math.min(.5, itemBonus('lifesteal')/100); }
function goldFindMult(){ return 1 + itemBonus('goldFind')/100; }
function xpGainMult(){ return 1 + itemBonus('xpGain')/100; }
/* a guaranteed ignite that does NOT depend on the fire-DoT upgrade (the "Scorching"
   affix and the Emberblade/Pyre uniques burn even at 0 upgrade stacks) */
function forceIgnite(m, baseDmg, chance){
  if (!m || m.dead || Math.random() >= chance) return;
  if (!m.dots) m.dots = {};
  const dps = baseDmg*0.5, dur = 2.5;
  m.dots.fire = { t:dur, dps, type:'fire' };
}
/* on-hit hook for the new UNIQUE weapons' qualitative effects */
function uniqueOnHit(m, final, isCrit, elem){
  const ig = CFG.uniques.u_emberblade.ignite;
  if (uniqAny('u_emberblade')) forceIgnite(m, final, ig.chance);
  const py = CFG.uniques.u_pyre;
  if (uniqOn('u_pyre')) forceIgnite(m, final, py.ignite.chance);
  if (uniqAny('u_frostedge') && isCrit) {
    const c = CFG.uniques.u_frostedge.critChill;
    m.slowFrac = Math.max(m.slowFrac||0, c.slow); m.slowT = Math.max(m.slowT||0, c.dur);
  }
  if (uniqAny('u_voidfang') && isCrit) {
    G.stealthT = Math.max(G.stealthT, CFG.uniques.u_voidfang.critBlind);   // mobs lose you
  }
  const cm = CFG.uniques.u_comet;
  if (uniqOn('u_comet') && isCrit && Math.random() < cm.comet.chance) {
    G.meteor = G.meteor || [];
    G.meteor.push({ x:m.x, y:m.y, t:.7, blast:cm.comet.blast, dmg:final*cm.comet.mult });
    addFloat(m.x, m.y-40, '☄', '#58a6ff');
  }
}
const clsWpn = ()=> G.cls==='daggers' ? CFG.weapons.daggers :
                  (G.cls==='mage' ? CFG.weapons.mage : CFG.weapons.crossbow);
const wpnBase = ()=> clsWpn().base;
/* armor & elemental-resist PENETRATION: shred a flat fraction of the target's
   armor and resist before they soak the hit (physical defense).

   the MAGE stacks extra on top (G.up.pen, via u_magepen) — its signature tool. */
function armorPen() {
  const extra = G.cls === 'mage' ? G.up.pen : 0;

}
function wpnDmg() {

  if (G.rageT > 0) d *= 1 + G.rageStacks*0.05;

}
/* total crit chance = class upgrade + flat % from uniques (the "crit" affix) */
function critChance() { return Math.min(.9, (G.up.crit||0) + itemBonus('crit')/100); }
function wpnRate() {
  const base = clsWpn().rate;

}
function moveSpd() { return CFG.player.speed * G.up.spd * (1 + itemBonus('spd')/100); }
function maxHp() { return CFG.player.hp + G.up.hpBonus + itemBonus('hp') + G.attr.end*4; }
function boltSpeed() {
  if (G.cls === 'mage') return CFG.weapons.mage.boltSpd * G.up.hawk;
  return CFG.weapons.crossbow.boltSpd * G.up.hawk;
}
function weaponTier() {
  let r = 0;
  for (const s of ['weaponL','weaponR']) if (G.items[s]) r = Math.max(r, CFG.irRank[G.items[s].rar]);

const clsName = ()=> t(G.cls==='daggers' ? 'cls_dag' : G.cls==='mage' ? 'cls_mag' : 'cls_xb');
/* ability-slot label for the HUD, by class */
function abName(i) {

  if (G.cls === 'mage')    return t(['ab1_mag','ab2_mag','ab3_mag'][i]);

function collideOBB(e) {
  for (const o of OBB) {
    const cx = clamp(e.x, o.x, o.x+o.w), cy = clamp(e.y, o.y, o.y+o.h);
    let dx = e.x-cx, dy = e.y-cy;
    const dd = dx*dx + dy*dy;
    if (dd < e.r*e.r) {
      if (dd > 0) { const l = Math.sqrt(dd); e.x = cx + dx/l*e.r; e.y = cy + dy/l*e.r; }
      else e.y = o.y - e.r;
    }
  }
}

/* ---------------- audio (WebAudio) ---------------- */
let AC = null, master = null;
let audioMuted = false, audioVol = 1;               // master audio control (pause → options)
function ac() {
  if (!AC) {
    try {
      AC = new (window.AudioContext||window.webkitAudioContext)();
      master = AC.createGain();                     // every beep routes through `master`
      master.gain.value = audioMuted ? 0 : audioVol;
      master.connect(AC.destination);
    } catch(e){}
  }
  if (AC && AC.state === 'suspended') AC.resume().catch(()=>{});
  return AC;
}
/* set the master volume (0..1) and optionally mute; live-updates the option UI */
function setAudio(vol, mute) {
  if (typeof mute === 'boolean') audioMuted = mute;
  if (typeof vol === 'number') audioVol = clamp(vol, 0, 1);
  if (master) master.gain.value = audioMuted ? 0 : audioVol;
}
function beep(freq, dur, type, vol) {
  const a = ac(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    o.connect(g); g.connect(master || a.destination);
    const now = a.currentTime;
    g.gain.setValueAtTime(vol||0.06, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + (dur||0.08));
    o.start(now); o.stop(now + (dur||0.08) + 0.02);
  } catch(e) {}
}
