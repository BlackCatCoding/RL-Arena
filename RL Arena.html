/* ---------------- combat: player ---------------- */
function tryAttack(dt) {
  G.acd -= dt; G.swT = Math.max(0, G.swT - dt);
  if (!mouse.held || G.acd > 0) return;
  const p = G.p;
  const aim = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  if (G.cls === 'daggers') {
    const w = CFG.weapons.daggers;
    const dmg = wpnDmg(), reach = w.reach;
    G.swT = .14; sfxHit();
    for (const m of G.mobs) {
      if (m.dead) continue;
      const rr = m.cr + reach;
      if (d2(m.x, m.y, p.x, p.y) > rr*rr) continue;
      const a = Math.atan2(m.y-p.y, m.x-p.x);
      let diff = a - aim;
      while (diff > Math.PI) diff -= TAU;
      while (diff < -Math.PI) diff += TAU;
      if (Math.abs(diff) > w.arc) continue;
      hitMob(m, dmg * w.hits, true);
      // UNIQUE Devourer: the claw strike also flings a tracking bolt at the foe
      if (uniqAny('u_devourer')) {
        G.bolts.push({ x:m.x, y:m.y,
          vx:Math.cos(a)*380, vy:Math.sin(a)*380, life:.6,
          dmg: dmg*w.hits*0.4, pierce:0, cut:G.up.cut, dead:false });
      }
    }
  } else if (G.cls === 'mage') {
    // LMB: a single fast arcane bolt — the "auto". The real power is in the
    // three spells (1/2/3). Bolt carries element pen & crit like the others.
    // UNIQUE Trinity Staff replaces this basic bolt with Power Surge (chain bolt).
    const w = CFG.weapons.mage;
    const dx = Math.cos(aim), dy = Math.sin(aim);
    const sp = boltSpeed();
    const xProj = Math.max(0, Math.floor(itemBonus('proj')));
    const bm = uniqBoltMods();
    // NEW: aurora adds bolt pierce; comet adds a glacial-burst flag on each hit
    const mpierce = G.up.pierce + (bm ? bm.boltPierce : 0) + uniqueBoltPierce();
    if (uniqOn('u_staff')) powerSurge();
    else {
      for (let i = 0; i < 1 + xProj; i++) {
        const aa = aim + (i - xProj/2) * 0.14;
        G.bolts.push({
          x: p.x + Math.cos(aa)*16, y: p.y + Math.sin(aa)*16,
          vx: Math.cos(aa)*sp, vy: Math.sin(aa)*sp, life:1.1,
          dmg: wpnDmg() * G.up.boltDmg, pierce: mpierce, cut: G.up.cut,
          magic:true, dead:false
        });
      }
    }
    sfxHit();
  } else {
    const w = CFG.weapons.crossbow;
    const dx = Math.cos(aim), dy = Math.sin(aim);
    const sp = boltSpeed();
    const off = (G.boltSide ^= 1) ? -w.spread : w.spread;
    // NEW: equipped crossbow-unique bolt modifiers + the "+proj" affix
    const bm = uniqBoltMods();
    const xProj = Math.max(0, Math.floor(itemBonus('proj'))) + (bm ? bm.extraBolt : 0);
    const pierce = G.up.pierce + (bm ? bm.boltPierce : 0) + uniqueBoltPierce();
    const boltFlags = {};
    if (bm && bm.iceBolt)  { boltFlags.elem = 'cold'; boltFlags.cold = true; }
    if (bm && bm.fireBolt) { boltFlags.elem = 'fire'; boltFlags.fire = true; }
    if (bm && bm.boltDetonate) boltFlags.det = bm.boltDetonate;
    // two-bolt alternating spread
    for (const s of [1,-1]) {
      G.bolts.push({
        x: p.x + dx*16 - dy*(s*off), y: p.y + dy*16 + dx*(s*off),
        vx: dx*sp, vy: dy*sp, life:1.2, dmg: wpnDmg(),
        pierce, cut: G.up.cut, dead:false, ...boltFlags
      });
    }
    // NEW "+proj" affix / unique extra bolts — a straight extra line
    for (let i = 0; i < xProj; i++) {
      G.bolts.push({
        x: p.x + dx*16, y: p.y + dy*16,
        vx: dx*sp, vy: dy*sp, life:1.2, dmg: wpnDmg()*0.9,
        pierce, cut: G.up.cut, dead:false, ...boltFlags
      });
    }
    // Split Volley upgrade: chance of an extra 3-bolt fan
    if (G.up.fan > 0 && Math.random() < G.up.fan) {
      for (const o2 of [-0.26, 0, 0.26]) {
        const aa = aim + o2;
        G.bolts.push({
          x: p.x + Math.cos(aa)*16, y: p.y + Math.sin(aa)*16,
          vx: Math.cos(aa)*sp, vy: Math.sin(aa)*sp, life:1.2,
          dmg: wpnDmg()*0.8, pierce:0, cut:G.up.cut, dead:false
        });
      }
    }
  }
  G.acd = wpnRate();
}

function hitMob(m, dmg, melee, elem) {
  elem = elem || 'phys';
  if (uniqueFireConv()) elem = 'fire';          // UNIQUE dagger: all damage becomes fire
  m.hitT = .14;
  let final = dmg, isCrit = false;
  // consume an armed next-crit from a previous critical
  if (G.nextCrit) { final *= 2; G.nextCrit = false; isCrit = true; }
  // roll a fresh critical (class upgrade + flat % from uniques)
  if (!isCrit && critChance() > 0 && Math.random() < critChance()) {
    final *= 2; isCrit = true;
    if (G.stealthCd <= 0) G.stealthT = Math.max(G.stealthT, 2); // go stealthed: mobs lose you (5s CD after)
    G.nextCrit = true;                      // your next hit deals 2x
    // UNIQUE jaws: a crit splinters into extra fire shards in a small fan
    const shards = uniqueCritShards();
    if (shards > 0) for (let i=0;i<shards;i++){ const fa = Math.atan2(G.aim.y-m.y, G.aim.x-m.x) + (i-(shards-1)/2)*.4; G.bolts.push({ x:m.x+Math.cos(fa)*8, y:m.y+Math.sin(fa)*8, vx:Math.cos(fa)*420, vy:Math.sin(fa)*420, life:.5, dmg:final*.25, pierce:0, fire:true, dead:false }); }
  }
  // armor & resist PENETRATION (mage only): shred a flat fraction of the target's
  // defense BEFORE it soaks the hit. This is what lets you keep up with later walls.
  const pen = armorPen();
  // elemental resistance: this mob shrugs % off its matching damage type
  const res = (m.res ? m.res[elem] || 0 : 0) * (1 - pen);
  final *= (1 - res);
  // physical hits soak in flat armor — later walls blunt claws & bolts
  if (elem === 'phys' && m.armor > 0) final = Math.max(1, final - m.armor * (1 - pen));
  // NEW: flat elemental bonuses ("+X fire/cold/volt") are added ON TOP of the
  // physical base as their own damage type. An elemental spell feeds ONLY its
  // own element; a physical hit feeds the whole pool. Each slice respects that
  // element's own resist. The number on the ground is the TOTAL, colour-sliced.
  const physVal = final;
  let total = physVal;
  const segs = [{ v: Math.max(1, Math.round(physVal)), col: (elem === 'phys' ? '#ff4d4d' : EL_COL[elem]) }];
  for (const pr of elPairs(elem)) {
    const v = pr.v * (1 - (m.res ? (m.res[pr.el] || 0) : 0) * (1 - pen));
    if (v <= 0) continue;
    total += v;
    segs.push({ v: Math.round(v), col: EL_COL[pr.el] });
  }
  total = Math.max(1, Math.round(total));
  m.hp -= total;
  addFloatSplit(m.x + m.r, m.y - m.r - 4, segs, isCrit);
  // lifesteal: class upgrade (melee) + the item affix (any hit) — off total dealt
  const lsPct = (melee && G.up.ls > 0 ? G.up.ls : 0) + lifestealPct();
  if (lsPct > 0) G.p.hp = Math.min(maxHp(), G.p.hp + total*lsPct);
  // elemental damage-over-time (bleed / fire / cold) — gated by the matching upgrade
  for (const type of ['bleed','fire','cold']) if (G.up[DOT_UP[type]] > 0) applyDot(m, type, total);
  // NEW: "Scorching" ignite affix — chance to light the target (no fire upgrade needed)
  if (igniteChance() > 0) forceIgnite(m, total, igniteChance());
  // NEW UNIQUE weapons' qualitative on-hit effects (ignite / chill / blind / comet)
  uniqueOnHit(m, total, isCrit, elem);
  if (m.hp <= 0) killMob(m);
}
function applyDot(m, type, hitDmg) {
  const c = DOT_CONF[type];
  const stacks = G.up[DOT_UP[type]];            // 0..3
  if (!stacks) return;
  const lv = Math.max(1, G.lvl);
  let dps = c.perLv * hitDmg * lv * stacks;     // % of the hit, scaled by level & stacks
  // elemental DoTs respect this mob's resistance to that element
  const res = m.res ? (m.res[DOT_ELEM[type]] || 0) : 0;
  dps *= (1 - res);
  if (!m.dots) m.dots = {};
  m.dots[type] = { t:c.dur, dps, type };
  if (type === 'cold') { m.slowFrac = c.slow; m.slowT = c.dur; }
}
function updateBleeds(dt) {
  for (const m of G.mobs) {
    if (m.dead || !m.dots) continue;
    // decay the slow (cold) timer
    if (m.slowT > 0) m.slowT -= dt;
    for (const type in m.dots) {
      const d = m.dots[type];
      d.t -= dt;
      d.acc = (d.acc || 0) + d.dps * dt;
      d.show = (d.show || 0) - dt;
      m.hp -= d.dps * dt;
      // tinted DoT number every 0.5s (aggregated), in the element colour
      if (d.show <= 0) {
        if (d.acc >= 1) addFloat(m.x + R(-8,8), m.y - m.r - 4, Math.round(d.acc) + ' ' + t(DOT_LABEL[type]), DOT_COL[type]);
        d.acc = 0; d.show = 0.5;
      }
      if (type === 'cold') m.slowT = Math.max(m.slowT, 0.25); // refresh the chill while it ticks
      if (d.t <= 0) { delete m.dots[type]; if (type==='cold') m.slowFrac = 0; }
      if (m.hp <= 0) { killMob(m); break; }
    }
  }
}

/* ---------------- orbit daggers (daggers class upgrade) ----------------
   Each orbit blade sits at G.orbAngle + i*(TAU/n) at radius ~ orbitR.
   Angular speed: base slow (0.6 rad/s) scaled by attack speed, capped so
   the orbit never spins faster than one full swing of your atk cycle.
   A blade deals its hit when it sweeps across a mob's position. */
function orbitRadius() { return 46 + G.up.orbit * 4; }
function orbitAngularSpeed() {
  // base slow: 0.6 rad/s; scales with your current attack speed,
  // capped at "100% of atk speed" = one full revolution per atk cycle.
  const base = G.cls==='daggers' ? CFG.weapons.daggers.rate : CFG.weapons.crossbow.rate;
  const speedMul = base / wpnRate();          // >1 = faster than base
  const cap = TAU / wpnRate();               // 1 rev / current atk cycle
  return Math.min(0.6 * speedMul, cap);
}
function updateOrbits(dt) {
  if (G.cls !== 'daggers' || G.up.orbit <= 0) return;
  G.orbAngle = (G.orbAngle + orbitAngularSpeed()*dt) % TAU;
  const p = G.p, rad = orbitRadius();
  const n = G.up.orbit;
  const hitDmg = wpnDmg() * G.up.orbitFrac;
  for (const m of G.mobs) {
    if (m.dead) continue;
    m.orbCd = Math.max(0, m.orbCd - dt);
    if (m.orbCd > 0) continue;
    for (let i=0; i<n; i++) {
      const a = G.orbAngle + i*(TAU/n);
      const bx = p.x + Math.cos(a)*rad, by = p.y + Math.sin(a)*rad;
      if (d2(bx,by,m.x,m.y) < (m.cr+10)*(m.cr+10)) {
        m.orbCd = 0.35; // one tick per mob per sweep window
        hitMob(m, hitDmg, true);
        break;
      }
    }
  }
}
function killMob(m) {
  if (m.dead) return;
  m.dead = true; G.kills++;
  sfxKill(m.rarity);
  // Bloodthirst (daggers): +5% dmg 4s per kill, cap +50%
  if (G.up.rageOn) {
    G.rageStacks = Math.min(10, G.rageStacks + 1);
    G.rageT = 4;
  }
  const n = clamp(Math.ceil(m.xp/40), 1, 6), v = Math.ceil(m.xp/n);
  for (let i=0; i<n; i++)
    G.orbs.push({ x:m.x+R(-22,22), y:m.y+R(-22,22), v, life:25, ph:R(0,TAU), dead:false });
  if (Math.random() < CFG.potDropChance[m.rarity])
    G.pots.push({ x:m.x+R(-18,18), y:m.y+R(-18,18), life:30, ph:R(0,TAU), dead:false });
  if (Math.random() < Math.min(CFG.dropChance[m.rarity]*G.up.dropMul, 1)) spawnDrop(m.x, m.y, m.rarity);
  // NEW: legendary loot has a chance to yield a UNIQUE dragon item of your class
  if (m.rarity==='lendario' && !m.boss && Math.random() < CFG.unicos.drop.lendario) spawnAnyUnique(m.x, m.y);
  if (m.boss) {
    G.bosses++;
    for (let i=0; i<3; i++) spawnDrop(m.x+R(-60,60), m.y+R(-60,60), i===0 ? 'lendario' : 'raro');
    // UNIQUE: the boss guarantees the dragon item of your class (signature drop)
    if (CFG.unicos.drop.boss >= 1) spawnUnique(m.x, m.y);
    // NEW RELIQUARY: every boss wave a chest materializes on the arena
    spawnReliquary(m.x, m.y);
    addFloat(m.x, m.y-40, t('boss_warn'), '#ffd23f');
  }
}

function hurtPlayer(n, elem) {
  const p = G.p;
  if (p.inv > 0 || p.dodgeT > 0 || G.over) return;
  p.hp -= n; p.inv = .5;
  const col = elem==='fire' ? '#ff9f43' : elem==='cold' ? '#58a6ff' : '#ff4d4d';
  addFloat(p.x, p.y-24, '-'+Math.round(n) + (elem && elem!=='phys' ? (elem==='fire'?' 🔥':' ❄') : ''), col);
  if (p.hp <= 0) { p.hp = 0; G.over = 'death'; }
}

/* ---------------- enemy projectiles (ranged mobs fire at you) ---------------- */
function updateEbolts(dt) {
  const p = G.p;
  for (const b of G.ebolts) {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x<0 || b.y<0 || b.x>WORLD.w || b.y>WORLD.h) { b.dead = true; continue; }
    for (const o of OBB) if (b.x>o.x && b.x<o.x+o.w && b.y>o.y && b.y<o.y+o.h) { b.dead = true; break; }
    if (b.dead) continue;
    // dodge (i-frames) negates the bolt just like a melee hit
    if (p.dodgeT <= 0 && d2(b.x,b.y,p.x,p.y) < (p.r+5)*(p.r+5)) {
      hurtPlayer(b.dmg, b.elem);
      if (b.burnOnHit) applyPlayerDot({ burn:b.burnOnHit.burn, burnDur:b.burnOnHit.burnDur });
      b.dead = true;
    }
  }
  G.ebolts = G.ebolts.filter(b => !b.dead);
}

/* ---------------- abilities (1/2/3) ---------------- */
function ability(i) {
  const A = G.ab[i];
  if (A.cd > 0 || G.over) return;
  if (G.cls === 'mage') {
    const S = CFG.weapons.mage.spells;
    if (i === 0) castIce(S.ice);      else if (i === 1) castLight(S.light); else castFire(S.fire);
    A.cd = S[i===0?'ice':i===1?'light':'fire'].cd * G.up.quick;
    sfxAbility(); return;
  }
  if (i === 0) { if (G.cls === 'daggers') dashStrike(); else fanShot(); }
  else if (i === 1) { if (G.cls === 'daggers') twirl(); else pointBlank(); }
  else { if (G.cls === 'daggers') flurry(); else arrowStorm(); }
  let cd = A.max;
  if (i === 0 && G.cls === 'daggers') cd *= G.up.dashCdMul;   // Reflexes
  cd *= G.up.quick;                                             // Quick Draw (crossbow)
  A.cd = cd; sfxAbility();
}
/* ---------------- Mage spells ---------------- */
function mageBase() { return (CFG.weapons.mage.base + G.attr.str); }
function castIce(S) {
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  const sp = S.projSpd * G.up.hawk;
  const count = S.count + G.up.iceCnt;                        // Ice Shards (stacks +1 shard)
  const staff = uniqOn('u_staff');
  const dMult = iceDmgMult();                                  // +20%/enemy pierced by ice in last 5s (Trinity staff)
  const dmg = mageBase() * S.dmgFrac * G.up.iceDmg * G.up.dmg * dMult;   // flat cold bonus is added in hitMob
  const slow = Math.min(.85, S.slow * (1 + G.up.iceCnt*0.15));  // +1 shard = stronger chill
  const ipierce = staff ? CFG.uniques.u_staff.icePierce : 0;    // staff: each shard pierces 3 foes
  const win = staff ? CFG.uniques.u_staff.iceStacks.window : 0;
  for (let k=0;k<count;k++) {
    const off = (k-(count-1)/2) * 0.16;                        // fan spread
    const aa = a + off;
    G.spells.push({
      kind:'ice', x:p.x+Math.cos(aa)*18, y:p.y+Math.sin(aa)*18,
      vx:Math.cos(aa)*sp, vy:Math.sin(aa)*sp, life:S.range/sp,
      dmg, slow, slowDur:S.slowDur, pierce:ipierce, iceWin:win, dead:false, seed:R(0,TAU)
    });
  }
  addFloat(p.x, p.y-26, t('m_sp_ice'), '#58a6ff');
}
function castLight(S) {
  // Ball Lightning: a hover orb materializes at the crosshair (clamped to range),
  // zaps the nearest foe every `zap` seconds for `hover` seconds, and CHAINS the
  // arc to `chains` extra nearby enemies. More chains = the archetypal chain-fest.
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  const dd = Math.min(S.range, Math.hypot(G.aim.x-p.x, G.aim.y-p.y) || S.range*0.6);
  const ox = clamp(p.x + Math.cos(a)*dd, 20, WORLD.w-20);
  const oy = clamp(p.y + Math.sin(a)*dd, 20, WORLD.h-20);
  const dmg = mageBase() * S.dmgFrac * G.up.ltDmg * G.up.dmg * iceDmgMult();
  G.orbBalls.push({
    kind:'light', x:ox, y:oy, t:S.hover, zapCd:0,
    dmg, chains: S.chains + G.up.ltChains, chainRange:S.chainRange, tap:S.tap,
    radius:S.radius, color:S.color, hitSet:new Set(), dead:false, seed:R(0,TAU)
  });
  addFloat(ox, oy-20, t('m_sp_light'), S.color);
}
function castFire(S) {
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  const sp = S.projSpd * G.up.hawk;
  const dmg = mageBase() * S.dmgFrac * G.up.fireDmg * G.up.dmg;         // flat fire bonus is added in hitMob
  G.spells.push({
    kind:'fire', x:p.x+Math.cos(a)*18, y:p.y+Math.sin(a)*18,
    vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:S.range/sp,
    dmg, blast:S.blast*G.up.fireBlast, color:S.color, dead:false, seed:R(0,TAU)
  });
  // UNIQUE mage staffs: any equipped staff with a fireFan fires a fan of extra
  // fireballs; if it also has a meteor, one is scheduled. The Trinity staff's
  // deeper ignite is covered by the "Scorching" on-hit hook (u_pyre/pyre).
  const MU = (G.items.weaponL && G.items.weaponL.ukey) ? CFG.uniques[G.items.weaponL.ukey] : null;
  if (MU && MU.fireFan) {
    const ff = MU.fireFan;                                  // total fireballs in the fan
    for (let i=1;i<ff;i++){ const fa=a+(i-((ff-1)/2))*0.28; G.spells.push({ kind:'fire', x:p.x+Math.cos(fa)*18, y:p.y+Math.sin(fa)*18, vx:Math.cos(fa)*sp, vy:Math.sin(fa)*sp, life:S.range/sp, dmg:dmg*.6, blast:S.blast*G.up.fireBlast*.6, color:S.color, dead:false, seed:R(0,TAU) }); }
  }
  if (MU && MU.meteor) {
    const met = MU.meteor;
    G.meteor.push({ x: clamp(G.aim.x,20,WORLD.w-20), y: clamp(G.aim.y,20,WORLD.h-20), t:.7, dmg: dmg*met.mult, blast: met.blast });
    G.floats.push({ txt:'☄', x: G.aim.x, y: G.aim.y, t:.6, col:'#ff9f43' });
  }
  addFloat(p.x, p.y-26, t('m_sp_fire'), S.color);
}
/* UNIQUE Trinity Staff — the basic "auto" becomes Power Surge: a lightning bolt
   that arcs from the target to up to `chains` more foes, +`perChain` dmg/hop. */
function powerSurge() {
  const PS = CFG.uniques.u_staff.powerSurge;
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  // primary target = nearest foe in a cone toward the crosshair
  let best=null, bd=PS.range*PS.range;
  for (const m of G.mobs) { if (m.dead) continue;
    const dd=d2(p.x,p.y,m.x,m.y); if (dd>bd) continue;
    const ma=Math.atan2(m.y-p.y, m.x-p.x); let diff=ma-a;
    while (diff>Math.PI) diff-=TAU; while (diff<-Math.PI) diff+=TAU;
    if (Math.abs(diff)>.7) continue; bd=dd; best=m;
  }
  if (!best) return;
  let dmg = wpnDmg()*G.up.boltDmg*iceDmgMult();
  let from = { x:p.x, y:p.y }, seen = new Set();
  for (let c=0;c<=PS.chains;c++) {
    const tgt = (c===0) ? best : (()=>{ let nx=null,nd=PS.range*PS.range;
      for (const m of G.mobs){ if (m.dead||seen.has(m)) continue; const d=d2(from.x,from.y,m.x,m.y); if (d<nd){nd=d;nx=m;} }
      if (nx) seen.add(nx); return nx; })();
    if (!tgt) break;
    if (c>0) dmg *= (1+PS.perChain);
    G.arcs.push({ x1:from.x, y1:from.y, x2:tgt.x, y2:tgt.y, t:.14, dead:false });
    hitMob(tgt, dmg, false, 'volt');
    from = tgt;
  }
}
function aimDir() {
  const p = G.p;
  let dx = (key.d?1:0)-(key.a?1:0), dy = (key.s?1:0)-(key.w?1:0);
  if (!dx && !dy) { const a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x); dx = Math.cos(a); dy = Math.sin(a); }
  const l = Math.hypot(dx,dy)||1; return { dx:dx/l, dy:dy/l };
}
function dashStrike() {
  const p = G.p, d = aimDir();
  p.x = clamp(p.x + d.dx*170, 20, WORLD.w-20);
  p.y = clamp(p.y + d.dy*170, 20, WORLD.h-20);
  collideOBB(p);
  p.dodgeT = 0.18;
  const dmg = (G.lvl + G.wave) * 2;
  for (const m of G.mobs) {
    if (m.dead) continue;
    const rx = m.x - p.x, ry = m.y - p.y;
    const along = rx*d.dx + ry*d.dy;
    const perp  = Math.abs(rx*d.dy - ry*d.dx);
    if (along > -m.cr && along < 200 && perp < 52 + m.cr) {
      hitMob(m, dmg, true);
      addFloat(p.x + d.dx*60, p.y + d.dy*60 - 20, t('dash'), '#7ee787');
    }
  }
}
function fanShot() {
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  const sp = CFG.weapons.crossbow.boltSpd;
  for (const off of [-0.26, 0, 0.26]) {
    const aa = a + off;
    G.bolts.push({ x:p.x+Math.cos(aa)*16, y:p.y+Math.sin(aa)*16,
                   vx:Math.cos(aa)*sp, vy:Math.sin(aa)*sp, life:1.2, dmg:wpnDmg(), dead:false });
  }
}
function twirl() {
  const p = G.p, dmg = (G.lvl + G.wave) * 1.5, reach = 90;
  for (const m of G.mobs) {
    if (m.dead) continue;
    if (d2(m.x,m.y,p.x,p.y) < (reach + m.cr)*(reach + m.cr)) hitMob(m, dmg, true);
  }
  addFloat(p.x, p.y-20, '✻', '#a06bff');
}
function pointBlank() {
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  const sp = CFG.weapons.crossbow.boltSpd * 1.4;
  G.bolts.push({ x:p.x+Math.cos(a)*16, y:p.y+Math.sin(a)*16,
                 vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1.2, dmg:wpnDmg()*3, pierce:1, dead:false });
  addFloat(p.x, p.y-20, '◈', '#ff9f43');
}
function flurry() { G.flurryT = 3; addFloat(G.p.x, G.p.y-20, 'adrenaline', '#7ee787'); }
function arrowStorm() {
  const p = G.p, a = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  const sp = CFG.weapons.crossbow.boltSpd * 0.95;
  for (let i=0;i<8;i++) {
    const aa = a - 0.55 + (i/7)*1.1;
    G.bolts.push({ x:p.x+Math.cos(aa)*16, y:p.y+Math.sin(aa)*16,
                   vx:Math.cos(aa)*sp, vy:Math.sin(aa)*sp, life:1.3, dmg:wpnDmg()*0.8, dead:false });
  }
  addFloat(p.x, p.y-20, '✦✦✦', '#ff4dd2');
}

/* ---------------- mobs ---------------- */
/* Per-wave visual variety: more body shapes "unlock" as waves climb, so
   high waves are a mixed crowd. Bosses get their own creature sprite. */
const MOB_SHAPES = ['circle','square','tri','diamond','hex','star','blob'];
const shapeUnlocked = wave => clamp(2 + Math.ceil(wave/2), 1, MOB_SHAPES.length);
function rollShape(wave){ const n = shapeUnlocked(wave); return MOB_SHAPES[RI(n)]; }
function rollMobColor(){ return 'hsl('+RI(360)+',68%,62%)'; }

const LEAD = { normal:.3, elite:.5, raro:.7, mitico:.9, lendario:1 };   // predictive intercept
const AGI  = { normal:.25, elite:.5, raro:.65, mitico:.85, lendario:1 }; // bullet-dodge skill
/* Per-shape HItbox: the collision radius is scaled to the visible body so a
   bullet aimed at the sprite actually connects. A circle's edge = r; a square's
   corner = 1.41r; a star/blob bulge ≈ 1.35r. `m.cr` = this factor × m.r, and it
   drives every gameplay collision (bullets, melee reach, player contact, walls),
   while the floor-shadow/HP-bar visuals keep the tighter `m.r`. */
const SHAPE_HITF = { circle:1.0, square:1.4, tri:1.35, diamond:1.25, hex:1.2, star:1.35, blob:1.3, boss:1.4 };
function shapeHitFactor(shape){ return SHAPE_HITF[shape] || 1.0; }
function makeMob(rarity, x, y) {
  const c = CFG.mobs[rarity], w = G.wave, sc = CFG.wave.scale;
  const hpM  = 1 + sc.hp  * w;
  const dmgM = 1 + sc.dmg * w;
  const rAdd = w * sc.resPerWave;
  // resist is now BOUNDED at .45 (was .6) — penetration stays meaningful late
  const res = {
    phys: clamp(c.res.phys + rAdd, 0, .45),
    fire: clamp(c.res.fire + rAdd, 0, .45),
    cold: clamp(c.res.cold + rAdd, 0, .45)
  };
  // armor is BOUNDED per rarity (armorCap) — defense stops growing past a wall
  const armor = Math.min((c.armorCap != null ? c.armorCap : Infinity), (c.armor + (c.armorWave||0) * w)) * CFG.tank.armor;
  const hp = c.hp * hpM * CFG.tank.hp;
  const leadFrac = clamp(LEAD[rarity] + w*.02, 0, 1.2);
  const shape = c.boss ? 'boss' : rollShape(w);
  const cr = Math.round(c.r * shapeHitFactor(shape));
  return { x, y, r:c.r, cr, hp, maxHp:hp, spd:c.spd, dmg:c.dmg*dmgM, xp:c.xp,
           res, armor, far: c.far||null,
           shape,
           col: c.boss ? CFG.boss[ (G.zone===2?'b3':G.zone===1?'b2':'b1') ].col : rollMobColor(),
           leadFrac, agi: AGI[rarity],
           rarity, hitT:0, cd:R(.3,1), wt:0, dashCd:R(2,4.5), dvx:0, dvy:0,
           shotCd:R(.6,2), seed:R(0,100), orbCd:0, dots:null, slowT:0, slowFrac:0,
           dead:false, boss:!!c.boss,
           btype: c.boss ? (G.zone===2?'b3':G.zone===1?'b2':'b1') : null,
           bcd: c.boss ? (G.zone===2
                ? { orb:2, drain:CFG.boss.b3.drain.cd, nova:CFG.boss.b3.nova.cd, mist:CFG.boss.b3.mist.cd, dash:CFG.boss.b3.dash.cd*.4 }
                : G.zone===1
                ? { sum:1.5, hand:CFG.boss.b2.hand.cd*.5 }
                : { breath:CFG.boss.b1.breath.cd*.5, slam:CFG.boss.b1.slam.cd*.7 }) : null };
}
function rollRarity() {
  const q = CFG.rarity, r = Math.random();
  if (r < q.mitico) return 'mitico';
  if (r < q.mitico + q.raro) return 'raro';
  if (r < q.mitico + q.raro + q.elite) return 'elite';
  return 'normal';
}
function addMobAt(rarity) {
  const a = R(0,TAU), dd = R(340,540);
  const x = clamp(G.p.x + Math.cos(a)*dd, 40, WORLD.w-40);
  const y = clamp(G.p.y + Math.sin(a)*dd, 40, WORLD.h-40);
  G.mobs.push(makeMob(rarity, x, y));
}
/* spawn a specific-rarity mob at an exact world point (fissures vent here) */
function spawnAt(rarity, x, y) {
  const m = makeMob(rarity, clamp(x,40,WORLD.w-40), clamp(y,40,WORLD.h-40));
  m.hp = m.maxHp = m.maxHp*.6;        // vented mobs are wounded (burst, not swarm)
  G.mobs.push(m);
}
function spawnWave() {
  G.wave++;
  const zn = zoneForWave(G.wave);
  if (zn !== G.zone) switchZone(zn, true);        // wave 10 -> Calabouço, wave 25 -> Inferno
  if (G.wave % CFG.wave.bossEvery === 0) {
    addMobAt('lendario');
    for (let i=0; i<CFG.wave.bossGuards; i++) addMobAt('normal');
    addFloat(G.p.x, G.p.y-40, t('boss_warn'), '#ffd23f');
    despawnCat();            // the boss is here — Mog vanishes
  } else {
    const n = Math.min(CFG.wave.base + CFG.wave.perWave*(G.wave-1), CFG.wave.cap);
    for (let i=0; i<n; i++) addMobAt(rollRarity());
  }
}
function updateWaves(dt) {
  if (G.mobs.length !== 0) return;
  const nextIsBoss = ((G.wave + 1) % CFG.wave.bossEvery) === 0;
  if (nextIsBoss) {
    // pre-boss intermission: Mog materializes in the arena center for ~catWindow seconds
    if (!G.cat.on) { spawnShopCat(); G.waveCd = SHOP.catWindow; }
    G.waveCd -= dt;
    if (G.waveCd <= 0) spawnWave();
  } else {
    G.waveCd -= dt;
    if (G.waveCd <= 0) { spawnWave(); G.waveCd = 1.6; }
  }
}
/* Manual "next wave" button: spawn the next wave immediately, piling new
   mobs on top of the current ones (the wave number advances regardless).
   Short cooldown so it can't be mashed. */
function forceWave() {
  if (!G || G.over || G.upOpen || G.cmpOpen) return;
  if (G.waveBtnCd > 0) return;
  spawnWave();
  G.waveBtnCd = CFG.wave.forceCd;
  addFloat(G.p.x, G.p.y-40, t('wave_next'), '#58a6ff');
}

/* --- predictive helpers --- */
/* Where the player is expected to be ~reachDist/ms later. Mobs aim at this
   instead of your current spot, so they intercept you as you move. */
function predictPlayer(reachDist, spNow, m) {
  const t = m ? m.leadFrac : 0.6;                 // how much lead this mob uses
  const tt = Math.min(reachDist / Math.max(spNow, 1), 1.4) * t;
  return { x: clamp(G.p.x + G.pv.x*tt, 0, WORLD.w),
           y: clamp(G.p.y + G.pv.y*tt, 0, WORLD.h) };
}
/* Perpendicular "twin crossbow" shot pair: two bolts straddling the aim. */
function fireFar(m, pred) {
  const f = m.far;
  const dx = pred.x - m.x, dy = pred.y - m.y, dd = Math.hypot(dx,dy) || 1;
  const nx = dx/dd, ny = dy/dd, px = -ny, py = nx;   // forward + perpendicular
  const sp = 300, off = 14, spread = 0.06;
  const el = f.elem;
  for (const s of [1,-1]) {
    const ang = Math.atan2(ny, nx) + s*spread;
    G.ebolts.push({ x: m.x + nx*off - px*(s*off), y: m.y + ny*off - py*(s*off),
                    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
                    life: (f.reach)/sp + 0.4, dmg: f.dmg, elem: el, dead:false, seed:R(0,6) });
  }
}

/* ---------------- boss mechanics (ground slashes, novas, bleed-orbs) ---------------- */
/* Apply a DoT to the PLAYER (bleed/burn) — the inverse of the mob applyDot. */
function applyPlayerDot({ bleed=0, bleedDur=0, burn=0, burnDur=0 }) {
  const p = G.p;
  if (bleed > 0)  { p.dot.bleed = Math.max(p.dot.bleed, bleedDur); p.dot.bleedDps = Math.max(p.dot.bleedDps, bleed); }
  if (burn  > 0)  { p.dot.burn  = Math.max(p.dot.burn,  burnDur);  p.dot.burnDps  = Math.max(p.dot.burnDps,  burn); }
}
/* Tick player DoTs + stun; called every frame. Stun locks movement but NOT dodge. */
function updatePlayerDots(dt) {
  const p = G.p;
  if (p.stunT > 0) p.stunT -= dt;
  let tick = 0;
  if (p.dot.bleed > 0) { p.dot.bleed -= dt; tick += p.dot.bleedDps*dt; }
  if (p.dot.burn  > 0) { p.dot.burn  -= dt; tick += p.dot.burnDps*dt; }
  if (tick > 0 && p.inv <= 0 && !G.over) {
    p.hp -= tick; p.inv = .05;
    if (p.hp <= 0) { p.hp = 0; G.over = 'death'; }
  }
}
/* A telegraphed ground AoE (dragon slam, skeleton hand). Lands after `warn`,
   deals damage + optional stun if the player is still inside and not dodging. */
function spawnSlam(x, y, radius, dmg, warn, stun, elem, glow) {
  G.slams.push({ x, y, radius, dmg, t: warn, total: warn, stun, elem, glow, dead:false });
}
function updateSlams(dt) {
  const p = G.p;
  for (const s of G.slams) {
    s.t -= dt;
    if (s.t > 0) continue;
    if (!s.dead && d2(s.x,s.y,p.x,p.y) < s.radius*s.radius) {
      s.dead = true;
      if (p.dodgeT <= 0 && p.inv <= 0) {
        p.hp -= s.dmg; p.inv = .3;
        if (s.stun > 0) p.stunT = s.stun;          // 1s bone-hand stun (dodgeable)
        addFloat(p.x, p.y-24, '-'+Math.round(s.dmg)+(s.stun>0?' 💀':''), s.glow || '#ff4d4d');
        if (p.hp <= 0) { p.hp = 0; G.over = 'death'; }
      }
    }
  }
  G.slams = G.slams.filter(s => !s.dead && s.t > -0.15);
}
/* An expanding shockwave ring (vampire nova). Damages on crossing the ring. */
function spawnRing(x, y, dmg, growth, elem) {
  G.rings.push({ x, y, r: 20, maxR: 200, growth, dmg, hit:new Set(), elem, dead:false });
}
function updateRings(dt) {
  const p = G.p;
  for (const rg of G.rings) {
    rg.r += rg.growth*dt;
    if (!rg.hit.has('p') && Math.abs(Math.hypot(p.x-rg.x, p.y-rg.y) - rg.r) < 26) {
      rg.hit.add('p');
      if (p.dodgeT <= 0 && p.inv <= 0) {
        p.hp -= rg.dmg; p.inv = .3;
        addFloat(p.x, p.y-24, '-'+Math.round(rg.dmg), rg.elem==='fire' ? '#ff9f43' : '#ff4d4d');
        if (p.hp <= 0) { p.hp = 0; G.over = 'death'; }
      }
    }
    if (rg.r >= rg.maxR) rg.dead = true;
  }
  G.rings = G.rings.filter(rg => !rg.dead);
}
/* Red bleed-balls that orbit the caster and then shoot out in a ring (vampire). */
function spawnPballs(cx, cy, count, speed, dmg, fireDmg, color) {
  const base = G.t*2;
  for (let i=0;i<count;i++) {
    const a = base + i/count*TAU;
    G.pballs.push({ x:cx, y:cy, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed,
                    life:2.4, dmg, fireDmg, color, seed:R(0,TAU), dead:false });
  }
}
function updatePballs(dt) {
  const p = G.p;
  for (const b of G.pballs) {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x<0||b.y<0||b.x>WORLD.w||b.y>WORLD.h) { b.dead=true; continue; }
    for (const o of OBB) if (b.x>o.x&&b.x<o.x+o.w&&b.y>o.y&&b.y<o.y+o.h) { b.dead=true; break; }
    if (b.dead) continue;
    if (p.dodgeT <= 0 && d2(b.x,b.y,p.x,p.y) < (p.r+7)*(p.r+7)) {
      b.dead = true;
      if (p.inv <= 0) {
        p.hp -= b.dmg; p.inv = .3;
        applyPlayerDot({ bleed: b.dmg*.12, bleedDur: 4, burn: b.fireDmg*.4, burnDur: 3 });
        addFloat(p.x, p.y-24, '-'+Math.round(b.dmg)+' 🩸', '#ff2d4d');
        if (p.hp <= 0) { p.hp = 0; G.over = 'death'; }
      }
    }
  }
  G.pballs = G.pballs.filter(b => !b.dead);
}

/* === boss ability emitters === */
function dragonBreath(m, B) {
  // fan of fire bolts from the dragon's jaws
  const f = B.breath, base = Math.atan2(G.p.y-m.y, G.p.x-m.x);
  for (let i=-1;i<=1;i++) {
    const a = base + i*f.spread;
    G.ebolts.push({ x:m.x, y:m.y, vx:Math.cos(a)*320, vy:Math.sin(a)*320,
                    life:f.range/320+.2, dmg:f.dmg, elem:'fire', seed:R(0,6),
                    burnOnHit:{ burn:f.ignite, burnDur:f.igniteDur }, dead:false });
  }
}
function groundSlam(m, B, tag) {
  // the dragon darts in toward you and plants a fire patch where you were —
  // keep moving or take the ground AoE.
  const pred = predictPlayer(B.reach, m.spd, m);
  const dx = pred.x-m.x, dy = pred.y-m.y, dd = Math.hypot(dx,dy)||1;
  m.dvx = dx/dd*640; m.dvy = dy/dd*640;           // dash burst (decays in updateMobs)
  spawnSlam(pred.x, pred.y, B.radius, B.dmg, B.warn, 0, 'fire', B.glow || '#ff5a1e');
  addFloat(m.x, m.y-m.r-10, '🔥', '#ff9f43');
}
function skeletonSummon(m, B) {
  // conjure a mixed budget: a lesser skeleton, a skeleton mage, a skeleton archer
  const p = G.p, a = R(0,TAU);
  const near = (o)=> [m.x + Math.cos(a)*o*26, m.y + Math.sin(a)*o*26];
  const mk = (rarity, extra)=> { const [x,y]=near(extra||0); const mm=makeMob(rarity, x, y); mm.hp=mm.maxHp=.5*mm.maxHp; G.mobs.push(mm); };
  mk('normal', 0);                       // lesser skeleton (melee)
  if (B.summon.budget >= 2) {
    const mage = makeMob('elite', ...near(1)); mage.far = { shots:1, reach:460, min:240, rate:2.4, dmg:11, elem:'cold' }; mage.hp=mage.maxHp*=.5; G.mobs.push(mage);
  }
  if (B.summon.budget >= 3) {
    const arch = makeMob('elite', ...near(-1)); arch.far = { shots:2, reach:500, min:260, rate:2.2, dmg:9, elem:'phys' }; arch.hp=arch.maxHp*=.5; G.mobs.push(arch);
  }
  addFloat(m.x, m.y-m.r-14, '† ' + t('bsummon'), '#cfd8e6');
}
function boneHand(m, B) {
  // telegraph at the player's predicted spot — a bone hand slams from below.
  // Dodging when it lands negates the stun.
  const pred = predictPlayer(120, m.spd, m);
  spawnSlam(pred.x, pred.y, B.radius, B.dmg, B.warn, B.stun, 'phys', '#cfd8e6');
}
function vampireOrbs(m, B) { spawnPballs(m.x, m.y, B.orb.count, B.orb.speed, B.orb.dmg, B.orb.fireDmg, B.glow); addFloat(m.x, m.y-m.r-10, '☠', B.glow); }
function vampireDrain(m, B) {
  // a lifesteal beam: damage the player AND heal the boss
  if (d2(m.x,m.y,G.p.x,G.p.y) < B.range*B.range && G.p.inv <= 0 && G.p.dodgeT <= 0) {
    G.p.hp -= B.dmg; G.p.inv = .3;
    applyPlayerDot({ bleed: B.dmg*.15, bleedDur: 3 });
    m.hp = Math.min(m.maxHp, m.hp + B.dmg*B.life);
    addFloat(G.p.x, G.p.y-22, '-'+Math.round(B.dmg)+' ➔', B.glow);
    if (G.p.hp <= 0) { G.p.hp = 0; G.over = 'death'; }
  }
}
function vampireNova(m, B) { spawnRing(m.x, m.y, B.ringDmg, B.ringGrowth, 'fire'); addFloat(m.x, m.y-m.r-10, '✹', B.glow); }
function vampireMist(m, B) {
  // blood-mist: a lingering bleed+fire patch centred on the player
  if (d2(m.x,m.y,G.p.x,G.p.y) < B.radius*B.radius) {
    applyPlayerDot({ bleed: B.bleed, bleedDur: B.bleedDur, burn: B.fire, burnDur: 3 });
    addFloat(G.p.x, G.p.y-22, '🩸 '+t('bmist'), B.glow);
  }
}

function updateMobs(dt) {
  for (const m of G.mobs) {
    if (m.dead) continue;
    m.hitT -= dt; m.cd -= dt; m.shotCd = Math.max(0, m.shotCd - dt);
    if (m.iceT > 0) m.iceT = Math.max(0, m.iceT - dt);   // UNIQUE staff: ice-pierce buff window
    const dx = G.p.x - m.x, dy = G.p.y - m.y;
    const dist = Math.hypot(dx,dy) || 1;
    const spNow = m.slowT > 0 ? m.spd * (1 - m.slowFrac) : m.spd;  // chilled = slowed
    const stealthed = G.stealthT > 0; // mobs lost you after a crit

    // predictive target for this mob
    const pred = stealthed ? null : predictPlayer(dist, spNow, m);

    // --- boss behaviour (per zone) ---
    if (m.boss && !stealthed) {
      m.bcd = m.bcd || {};
      for (const k in m.bcd) m.bcd[k] -= dt;
      const B = CFG.boss[m.btype];
      if (m.btype === 'b1') {
        // ADULT DRAGON: breath a fire cone (AoE ignite) + dash-slam the ground
        if (m.bcd.breath !== undefined && m.bcd.breath <= 0 && dist < B.breath.range) {
          dragonBreath(m, B); m.bcd.breath = B.breath.cd;
        }
        if (m.bcd.slam !== undefined && m.bcd.slam <= 0 && dist < B.slam.reach) {
          groundSlam(m, B.slam, 'dragon'); m.bcd.slam = B.slam.cd;
        }
      } else if (m.btype === 'b2') {
        // SKELETON KING: conjure minions + ground-slam a bone hand (dodgeable 1s stun)
        if (m.bcd.sum !== undefined && m.bcd.sum <= 0) { skeletonSummon(m, B); m.bcd.sum = B.summon.cd; }
        if (m.bcd.hand !== undefined && m.bcd.hand <= 0 && dist < 420) {
          boneHand(m, B.hand); m.bcd.hand = B.hand.cd;
        }
      } else if (m.btype === 'b3') {
        // VAMPIRE LORD: bleed/fire strikes + bleed-orb circle + 4 ARPG moves
        if (m.bcd.orb !== undefined && m.bcd.orb <= 0 && dist < 520) { vampireOrbs(m, B); m.bcd.orb = B.orb.cd; }
        if (m.bcd.drain !== undefined && m.bcd.drain <= 0 && dist < B.drain.range) { vampireDrain(m, B.drain); m.bcd.drain = B.drain.cd; }
        if (m.bcd.nova !== undefined && m.bcd.nova <= 0 && dist < 380) { vampireNova(m, B.nova); m.bcd.nova = B.nova.cd; }
        if (m.bcd.mist !== undefined && m.bcd.mist <= 0) { vampireMist(m, B.mist); m.bcd.mist = B.mist.cd; }
        if (m.bcd.dash !== undefined && m.bcd.dash <= 0 && dist < 300) {
          const pdx = G.p.x-m.x, pdy = G.p.y-m.y, pdd = Math.hypot(pdx,pdy)||1;
          m.dvx = pdx/pdd*B.dash.speed; m.dvy = pdy/pdd*B.dash.speed;
          applyPlayerDot({ bleed: B.dash.bleed, bleedDur: B.dash.bleedDur });
          addFloat(m.x, m.y-m.r-14, t('dash'), B.glow); m.bcd.dash = B.dash.cd;
        }
      }
    }

    let vx = 0, vy = 0;
    if (stealthed) {
      // wander lost: no chase, no attack
      if (m.wanderA === undefined) m.wanderA = R(0,TAU);
      m.wanderA += R(-1,1)*dt*2;
      vx = Math.cos(m.wanderA)*spNow*0.5; vy = Math.sin(m.wanderA)*spNow*0.5;
      m.wt = 0; m.cd = Math.max(m.cd, 0.5);
    } else {
      // PREDICTIVE chase: head to where you'll be, not where you are
      const tx = pred.x - m.x, ty = pred.y - m.y, td = Math.hypot(tx,ty)||1;
      if (td > m.r + 26) { vx = tx/td*spNow; vy = ty/td*spNow; }

      // BULLET DODGE: sidestep player bolts that are about to cross you.
      // Skill scales by rarity (agi) — early mobs barely dodge, bosses weave.
      if (m.agi > 0.2) {
        let ax = 0, ay = 0, wsum = 0;
        for (const b of G.bolts) {
          if (b.dead) continue;
          const bx = b.x - m.x, by = b.y - m.y;
          if (bx*bx + by*by > 260*260) continue;          // only react to close bolts
          const bsd = Math.hypot(b.vx,b.vy)||1;
          const bnx = b.vx/bsd, bny = b.vy/bsd;
          // closing = -(bolt-mob)·v̂ : >0 means the bolt is heading TOWARD you
          const closing = -(bx*bnx + by*bny);
          if (closing <= 0) continue;                       // moving away / already past → no threat
          const perp = bx*bny - by*bnx;                     // lateral offset
          const hitW = m.cr + 6;
          if (Math.abs(perp) > hitW + 30) continue;         // bolt misses you anyway
          // steer perpendicular to the bolt, to the side AWAY from it; scaled by skill
          const push = (1 - Math.min(1, Math.abs(perp)/hitW)) * m.agi;
          const side = perp > 0 ? -1 : 1;                   // step to the open side
          ax += (-bny*side) * push;
          ay += ( bnx*side) * push;
          wsum += push;
        }
        if (wsum > 0) {
          const l = Math.hypot(ax,ay)||1;
          const dod = spNow * 0.9 * Math.min(1, wsum/1.5);
          m.avx = (m.avx||0) + (ax/l)*dod*dt;
          m.avy = (m.avy||0) + (ay/l)*dod*dt;
        }
      }

      // RANGED (twin crossbow): when you're out of melee reach, shoot the lead point.
      // Bosses shoot too — wider triple spread, so they pressure from range as well.
      if (m.far && dist > m.far.min && dist < m.far.reach && m.shotCd <= 0) {
        fireFar(m, pred);
        m.shotCd = m.far.rate;
      }
    }

    // integrate base + dash + dodge-velocity (dodge decays fast)
    m.x += (vx + m.dvx + (m.avx||0))*dt; m.y += (vy + m.dvy + (m.avy||0))*dt;
    m.dvx *= Math.exp(-3.2*dt); m.dvy *= Math.exp(-3.2*dt);
    m.avx = (m.avx||0) * Math.exp(-7*dt); m.avy = (m.avy||0) * Math.exp(-7*dt);
    m.x = clamp(m.x, m.r, WORLD.w-m.r); m.y = clamp(m.y, m.r, WORLD.h-m.r);
    collideOBB(m);
    if (!stealthed) {
      if (m.wt > 0) {
        m.wt -= dt;
        if (m.wt <= 0 && dist < m.cr + 42) hurtPlayer(m.dmg, 'phys');
      } else if (m.cd <= 0 && dist < m.cr + 34) {
        m.wt = .35; m.cd = m.boss ? 1.6 : R(.9,1.3);
      }
    }
  }
  for (let i=0; i<G.mobs.length; i++) for (let j=i+1; j<G.mobs.length; j++) {
    const a = G.mobs[i], b = G.mobs[j];
    if (a.dead || b.dead) continue;
    const dx = b.x-a.x, dy = b.y-a.y;
    const dd = Math.hypot(dx,dy), min = a.r + b.r;
    if (dd > 0 && dd < min) {
      const push = (min-dd)/2;
      a.x -= dx/dd*push; a.y -= dy/dd*push;
      b.x += dx/dd*push; b.y += dy/dd*push;
    }
  }
  G.mobs = G.mobs.filter(m => !m.dead);
}

/* ---------------- projectiles ---------------- */
function updateBolts(dt) {
  for (const b of G.bolts) {
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if (b.life <= 0 || b.x<0 || b.y<0 || b.x>WORLD.w || b.y>WORLD.h) { b.dead = true; continue; }
    for (const o of OBB) if (b.x>o.x && b.x<o.x+o.w && b.y>o.y && b.y<o.y+o.h) { b.dead = true; break; }
    if (b.dead) continue;
    for (const m of G.mobs) {
      if (m.dead) continue;
      if (d2(b.x,b.y,m.x,m.y) < (m.cr+4)*(m.cr+4)) {
        hitMob(m, b.dmg, false, b.elem || 'phys');
        // per-bolt effect hooks (unique crossbow bolts + the elemental affixes)
        if (b.cold) { m.slowFrac = Math.max(m.slowFrac||0, .5); m.slowT = Math.max(m.slowT||0, 1.5); }
        if (b.fire) forceIgnite(m, b.dmg, 1);
        if (b.det) explode(b.x, b.y, b.det.radius, b.dmg*b.det.frac, 'fire');
        if (!b.pierce) { b.dead = true; break; }
      }
    }
  }
  G.bolts = G.bolts.filter(b => !b.dead);
}

/* ---------------- mage spells (ice shards / fireball / ball-lightning orb) ---------------- */
function updateSpells(dt) {
  for (const s of G.spells) {
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (s.life <= 0 || s.x<0 || s.y<0 || s.x>WORLD.w || s.y>WORLD.h) { s.dead = true; continue; }
    for (const o of OBB) if (s.x>o.x && s.x<o.x+o.w && s.y>o.y && s.y<o.y+o.h) { s.dead = true; break; }
    if (s.dead) continue;
    for (const m of G.mobs) {
      if (m.dead) continue;
      if (d2(s.x,s.y,m.x,m.y) < (m.cr+8)*(m.cr+8)) {
        if (s.kind === 'ice') {
          hitMob(m, s.dmg, false, 'cold');
          // chill (slow) — independent of the damage; the shard is the control tool
          m.slowFrac = Math.max(m.slowFrac||0, s.slow);
          m.slowT = Math.max(m.slowT||0, s.slowDur);
          // UNIQUE Trinity Staff: piercing ice shards stamp each foe with a recency
          // window — while a foe is "pierced-ice" (last 5s) it feeds +20% mage dmg
          if (s.pierce > 0) {
            s.pierce--;
            m.iceT = s.iceWin || 5;   // stamp this foe; the shard keeps flying
            continue;
          }
        } else {  // fire: AoE explosion on impact
          hitMob(m, s.dmg, false, 'fire');
          explode(m.x, m.y, s.blast, s.dmg*0.6, 'fire');
          s.dead = true;
        }
        break;
      }
    }
  }
  G.spells = G.spells.filter(s => !s.dead);
}
/* fireball AoE: splash damage to everyone in `radius` around (x,y) */
function explode(x, y, radius, dmg, elem) {
  G.floats.push({ txt:'💥', x, y, t:.6, col:'#ff9f43' });
  for (const m of G.mobs) {
    if (m.dead) continue;
    if (d2(x,y,m.x,m.y) <= radius*radius + m.cr*m.cr) hitMob(m, dmg, false, elem);
  }
}
/* Ball Lightning: a hovering orb that repeatedly zaps the nearest foe and
   CHAINS the arc outward to extra nearby enemies (the archetypal chain effect). */
function updateOrbBalls(dt) {
  for (const o of G.orbBalls) {
    o.t -= dt; o.zapCd -= dt;
    if (o.t <= 0) { o.dead = true; continue; }
    if (o.zapCd <= 0) {
      o.zapCd = CFG.weapons.mage.spells.light.zap;
      o.hitSet.clear();
      // nearest foe in radius = the primary zap
      let best = null, bd = o.radius*o.radius;
      for (const m of G.mobs) {
        if (m.dead) continue;
        const d = d2(o.x,o.y,m.x,m.y);
        if (d < bd) { bd = d; best = m; }
      }
      if (best) {
        best.hitT = .14;
        hitMob(best, o.dmg, false, 'volt');
        // CHAIN: from the hit mob, arc to up to `chains` more nearby enemies
        let from = best;
        const seen = new Set([best]);
        for (let c=0; c<o.chains; c++) {
          let nx = null, nd = o.chainRange*o.chainRange;
          for (const m of G.mobs) {
            if (m.dead || seen.has(m)) continue;
            const d = d2(from.x,from.y,m.x,m.y);
            if (d < nd) { nd = d; nx = m; }
          }
          if (!nx) break;
          seen.add(nx);
          // each hop is weaker (ball-lightning decay)
          hitMob(nx, o.dmg * Math.pow(o.tap, c+1), false, 'volt');
          o.floats = o.floats || [];
          o.floats.push({ x0:from.x, y0:from.y, x1:nx.x, y1:nx.y, life:.2 });
          from = nx;
        }
      }
    }
  }
  G.orbBalls = G.orbBalls.filter(o => !o.dead);
}


/* ---------------- orbs / potions ---------------- */
/* ---------------- zone hazards: traps + fissures ---------------- */
/* Calabouço: floor spikes lance up and hurt on contact, then re-arm. */
function updateTraps(dt) {
  const p = G.p;
  for (const tr of G.traps) {
    tr.flash = Math.max(0, tr.flash - dt);
    tr.cd = Math.max(0, tr.cd - dt);
    if (tr.cd > 0) continue;                       // cooling down
    if (d2(tr.x,tr.y,p.x,p.y) < (tr.r + p.r)*(tr.r + p.r)) {
      tr.flash = .5; tr.cd = 3.5;                 // strike + re-arm
      if (p.dodgeT <= 0 && p.inv <= 0) {
        p.hp -= 12; p.inv = .4;
        addFloat(p.x, p.y-24, '-12 '+t('trap_stun'), '#ff4d4d');
        if (p.hp <= 0) { p.hp = 0; G.over = 'death'; }
      }
    }
  }
}
/* Inferno: fissures throbb then vent an elite+ mob up through the basalt.
   A short warning window (f.pulse) so the player can sidestep. */
function updateFissures(dt) {
  for (const f of G.fissures) {
    f.cd -= dt;
    if (f.cd <= 0) {
      // wind-up, then erupt
      if (f.pulse === 0) { f.pulse = 1.2; f.cd = R(6,11); continue; }
      f.pulse -= dt;
      if (f.pulse <= 0) {
        f.pulse = 0;
        const r = Math.random()<.5 ? 'elite' : 'raro';
        spawnAt(r, f.x, f.y);
        addFloat(f.x, f.y, t('fissure'), '#ff9f43');
      }
    }
  }
}
function updateOrbs(dt) {
  const p = G.p;
  for (const o of G.orbs) {
    o.life -= dt; o.ph += dt*4;
    const dd = d2(o.x,o.y,p.x,p.y);
    if (dd < 110*110) { const l = Math.sqrt(dd)||1; o.x += (p.x-o.x)/l*420*dt; o.y += (p.y-o.y)/l*420*dt; }
    if (dd < 20*20) { gainXp(o.v); o.dead = true; }
  }
  G.orbs = G.orbs.filter(o => !o.dead && o.life > 0);
  for (const o of G.pots) {
    o.life -= dt; o.ph += dt*3;
    if (d2(o.x,o.y,p.x,p.y) < 22*22 && p.potions < p.maxPots) {
      p.potions++; sfxPickup(); o.dead = true;
      addFloat(p.x, p.y-28, '+'+t('pot'), '#7ee787');
    }
  }
  G.pots = G.pots.filter(o => !o.dead && o.life > 0);
}
function usePotion() {
  if (G.p.potions > 0) {
    G.p.potions--;
    G.p.hp = Math.min(maxHp(), G.p.hp + maxHp()*0.4);
    addFloat(G.p.x, G.p.y-28, t('potion_used'), '#7ee787'); sfxPotion();
  } else {
    addFloat(G.p.x, G.p.y-28, t('potion_empty'), '#8b949e');
  }
}

/* ---------------- loot (prefix/suffix, PoE-style) ---------------- */
function rollFromTable(table) {
  const r = Math.random();
  for (const [th, rar] of table) if (r <= th) return rar;
  return table[table.length-1][1];
}
function spawnDrop(x, y, sourceRarity) {
  let rar = rollFromTable(CFG.lootTable[sourceRarity]);
  if (G.lvl < CFG.rareGate && CFG.irRank[rar] > CFG.irRank.raro) rar = 'raro';
  G.drops.push(makeDrop(x, y, rar));
}
/* UNIQUE items — class-locked dragon drops. Bosses guarantee your class's
   SIGNATURE unique; legendary loot (12%) and reliquary chests roll ANY unique
   from your class's pool. Only your own class's uniques are usable; a foe's
   class unique that drops is just sellable gold. */
function makeUnique(x, y, ukey) {
  const U = CFG.uniques[ukey];
  const affixes = (U.affixes||[]).map(a => ({ ...a }));
  const name = t(U.key);
  const d = { x: clamp(x,30,WORLD.w-30), y: clamp(y,30,WORLD.h-30), slot: U.slot,
              rar:'unico', ukey, cls: U.cls, affixes, unique:true,
              name, statText: U.statText || affixes.map(a=>'+'+a.val+' '+STAT_N[a.stat]).join('  ') };
  if (!G.bestItem || CFG.irRank[d.rar] > CFG.irRank[G.bestItem.rar]) G.bestItem = d;
  return d;
}
/* boss signature drop — the one "class brand" unique */
function spawnUnique(x, y) {
  const ukey = CFG.CLS_UNIQUE[G.cls];
  if (ukey) G.drops.push(makeUnique(x+R(-40,40), y+R(-40,40), ukey));
}
/* any unique from the class pool — used by legendary 12% drops + reliquary */
function spawnAnyUnique(x, y) {
  const pool = CFG.UNIQ_POOL[G.cls];
  if (!pool || !pool.length) return;
  const ukey = pool[RI(pool.length)];
  G.drops.push(makeUnique(x+R(-40,40), y+R(-40,40), ukey));
}
/* ---------------- RELIQUARY (reliquiario) chests ----------------
   A chest materializes in the open near a fallen boss (each boss wave). Stand
   within range and press F to open it: a guaranteed legendary roll and a 35%
   chance to spawn a UNIQUE dragon item of your class. Disappears after 30s. */
function spawnReliquary(x, y) {
  const a = R(0, TAU), dd = R(80, 140);
  G.chests.push({ x: clamp(x + Math.cos(a)*dd, 40, WORLD.w-40),
                  y: clamp(y + Math.sin(a)*dd, 40, WORLD.h-40),
                  life: CFG.reliquary.life, ph: R(0, TAU), dead:false });
}
function updateChests() {
  const R0 = CFG.reliquary, p = G.p;
  for (const ch of G.chests) {
    if (ch.dead) continue;
    ch.life -= 1/60;                       // decays once per frame; 0 → vanishes
    if (ch.life <= 0) { ch.dead = true; continue; }
    if (d2(ch.x, ch.y, p.x, p.y) <= R0.openRange*R0.openRange) {
      ch.opened = ch.opened || false;
    }
  }
  G.chests = G.chests.filter(c => !c.dead);
}
function openNearbyChest() {
  const R0 = CFG.reliquary, p = G.p;
  for (const ch of G.chests) {
    if (ch.dead || ch.opened) continue;
    if (d2(ch.x, ch.y, p.x, p.y) <= R0.openRange*R0.openRange) {
      ch.opened = true; ch.dead = true;
      sfxPickup();
      addFloat(ch.x, ch.y-30, t('reliq'), CFG.irColor.unico);
      // guaranteed legendary item
      G.drops.push(makeDrop(ch.x, ch.y, 'lendario'));
      // chance at a unique dragon item of your class
      if (Math.random() < R0.loot.uniqueChance) spawnAnyUnique(ch.x, ch.y);
      return;
    }
  }
}

/* ---------------- MAGNET (imã de loot) ----------------
   A pickup that appears on the arena floor. Walk into it to arm the attract
   effect for `magnet.dur` seconds: during that window every ground item,
   XP orb and potion within `magnet.radius` is dragged to the player at
   `magnet.pullSpd`. After it's collected (or expires) it stays gone for
   `magnet.respawn` s, then a fresh one spawns. */
function spawnMagnet() {
  const M = G.magnet;
  for (let i=0; i<12; i++) {
    const x = R(80, WORLD.w-80), y = R(80, WORLD.h-80);
    // keep it off the player so it has to be sought out
    if (d2(x, y, G.p.x, G.p.y) > 220*220) {
      M.x = x; M.y = y; M.on = true; M.ph = R(0, TAU); return;
    }
  }
  M.x = WORLD.w - 100; M.y = WORLD.h - 100; M.on = true; M.ph = 0;
}
/* move one ground object toward the player, clamping the last few px so it
   lands inside the pickup radius instead of oscillating on top of the player */
function _magPull(o, p, dt) {
  const dx = p.x - o.x, dy = p.y - o.y;
  const dd = Math.hypot(dx, dy) || 1;
  const step = CFG.magnet.pullSpd * dt;
  if (dd <= step + 18) { o.x = p.x; o.y = p.y; return; }   // snap into pickup range
  o.x += dx/dd * step; o.y += dy/dd * step;
}
function updateMagnet(dt) {
  const M = G.magnet, p = G.p, C = CFG.magnet;
  M.ph += dt;
  if (M.on && d2(M.x, M.y, p.x, p.y) < 30*30) {
    M.on = false; G.magT = C.dur; G.magCd = 0;
    sfxMagnet();
    addFloat(p.x, p.y-34, t('magnet_on')+' '+Math.round(C.dur)+'s', '#c652ff');
  }
  if (G.magT > 0) {
    G.magT = Math.max(0, G.magT - dt);
    if (G.magT <= 0) G.magCd = C.respawn;         // effect ended → begin respawn wait
    for (const d of G.drops)  if (d2(d.x,d.y,p.x,p.y) < C.radius*C.radius) _magPull(d, p, dt);
    for (const o of G.orbs)   if (d2(o.x,o.y,p.x,p.y) < C.radius*C.radius) _magPull(o, p, dt);
    for (const o of G.pots)   if (d2(o.x,o.y,p.x,p.y) < C.radius*C.radius) _magPull(o, p, dt);
  } else if (G.magCd > 0) {
    G.magCd = Math.max(0, G.magCd - dt);
    if (G.magCd <= 0) spawnMagnet();
  }
}
function makeDrop(x, y, rar, slot) {
  // class-locked weapon slots + shared gear (armor/amulet are class-agnostic)
  const gearPool = weaponSlots().concat(['armor','amulet']);
  slot = slot || gearPool[RI(gearPool.length)];
  const sc = CFG.irScale[rar];
  const nAff = CFG.irAffix[rar];
  const affixes = [];
  const usedStat = new Set();
  for (let i=0; i<nAff; i++) {
    const isPrefix = i % 2 === 0;
    const pool = AFFIX[isPrefix ? 'prefix' : 'suffix'];
    const a = pool[RI(pool.length)];
    if (usedStat.has(a.stat) && pool.length > 1) continue;
    usedStat.add(a.stat);
    const val = Math.round(R(a.lo, a.hi) * (1 + sc));
    affixes.push({ stat:a.stat, val, name:a.name, side:isPrefix?'prefix':'suffix' });
  }
  const d = { x: clamp(x,30,WORLD.w-30), y: clamp(y,30,WORLD.h-30), slot, rar, ph:R(0,TAU),
              affixes, legend: rar==='lendario' };
  // base name: weapons come from the class's own category; armor/amulet are shared
  const isWpn = weaponSlots().indexOf(slot) >= 0;
  const base = isWpn ? WPN_CAT[G.cls].name : BASE[slot];
  let name = base;
  for (const a of affixes) {
    if (a.side === 'prefix') name = a.name + ' ' + name;
    else name = name + ' ' + a.name;
  }
  d.name = name;
  d.statText = affixes.map(a => '+'+a.val+' '+STAT_N[a.stat]).join('  ');
  if (!G.bestItem || CFG.irRank[rar] > CFG.irRank[G.bestItem.rar]) G.bestItem = d;
  return d;
}
function updateDrops() {
  const p = G.p;
  for (const d of G.drops) {
    if (d2(d.x,d.y,p.x,p.y) < 26*26) {
      const cur = G.items[d.slot];
      if (!cur) {
        // slot is empty → just equip it
        G.items[d.slot] = d;
        p.hp = Math.min(p.hp, maxHp());
        if (!G.bestItem || CFG.irRank[d.rar] > CFG.irRank[G.bestItem.rar]) G.bestItem = d;
        sfxPickup();
        addFloat(p.x, p.y-34, d.name + (d.statText ? ' ('+d.statText+')' : ''), CFG.irColor[d.rar]);
        d.dead = true;
      } else if (newStrictlyBetter(d, cur)) {
        // strictly better (higher rarity, or better affixes at same rarity) → ask which to keep
        G.cmpQueue.push({ it: d, source:'drop' });
        d.dead = true;             // lifted off the arena; pending in compare
        if (!G.cmpOpen) openCmpWindow();
      } else {
        // equal-or-worse stats → auto-sell for gold, no window
        const g = Math.round(CFG.goldFor[d.rar] * goldFindMult());
        p.gold += g; sfxGold();
        addFloat(p.x, p.y-30, t('low_loot')+' +'+g+' '+t('gold'), '#ffd23f');
        d.dead = true;
      }
    }
  }
  G.drops = G.drops.filter(d => !d.dead);
}

/* ---------------- XP / level / attributes / class upgrades ---------------- */
function gainXp(n) {
  G.xp += n * G.up.xpMul * xpGainMult();
  let leveled = 0;
  while (G.xp >= XP_FOR(G.lvl)) {
    G.xp -= XP_FOR(G.lvl); G.lvl++;
    leveled++;
    G.attrPts++;                       // 1 attribute point per level
    G.p.hp = Math.min(maxHp(), G.p.hp + 8);
    if (G.lvl % 5 === 0) G.clsUpQueue++;  // class upgrade pool every 5 levels
  }
  if (G.clsUpQueue > 0 && !G.upOpen) openUp();
}

    { k:'u_mfire',   f:g=>{ g.up.fireBlast = Math.min(2, g.up.fireBlast + .25); } }, // fire AoE +25% radius
    { k:'u_mfire2',  f:g=>{ g.up.fireDmg *= 1.15; } },                           // fire +15% dmg
    { k:'u_mbolt',   f:g=>{ g.up.boltDmg *= 1.15; } },                          // LMB arcane bolt +15%
    // shared / quality of life
    { k:'u_mkeen',   f:g=>{ g.up.dmg *= 1.12; } },
    { k:'u_mfren',   f:g=>{ g.up.atk *= 1.10; } },
    { k:'u_mswift',  f:g=>{ g.up.spd *= 1.08; } },
    { k:'u_miron',   f:g=>{ g.up.hpBonus += 20; G.p.hp += 20; } },
    { k:'u_mloot',   f:g=>{ g.up.dropMul += .12; } }
  ]
};
function openUp() {
  G.upOpen = true; G.paused = true;
  const pool = CLASS_UPGRADES[G.cls];
  // pick 3 distinct at random; keep replicable (stacks).
  const idx = new Set();
  while (idx.size < Math.min(3, pool.length)) idx.add(RI(pool.length));
  document.getElementById('upT').textContent = t('up_title') + '  ·  ' + clsName();
  const cards = document.getElementById('upCards');
  cards.innerHTML = '';
  for (const i of idx) {
    const u = pool[i];
    const b = document.createElement('button');
    b.className = 'upc';
    const times = G.attrUpgUsed[u.k] || 0;
    b.innerHTML = '<b>' + t(u.k) + (times>0 ? ' <span style="color:#58a6ff">' + times + '×</span>' : '') +
                  '</b><span>' + t(u.k + '_d') + '</span>';
    b.onclick = () => {
      u.f(G);
      G.attrUpgUsed[u.k] = (G.attrUpgUsed[u.k] || 0) + 1;
      G.clsUpQueue = Math.max(0, G.clsUpQueue - 1);
      if (G.clsUpQueue > 0) openUp();
      else { G.upOpen = false; G.paused = false; document.getElementById('up').style.display = 'none'; }
    };
    cards.appendChild(b);
  }
  document.getElementById('up').style.display = 'flex';
}

/* ---------------- floats ---------------- */
function addFloat(x, y, txt, col) {
  G.floats.push({ x, y, txt, col, t:1 });
  if (G.floats.length > 60) G.floats.shift();
}
/* a damage number colour-sliced by segment: the total is shown, each digit
   painted in the colour of the slice it belongs to (physical digits red,
   elemental digits their own colour). segs = [{v, col}, ...] in display order. */
function addFloatSplit(x, y, segs, crit) {
  const weights = segs.map(g => Math.max(1, g.v));
  const total = Math.max(1, Math.round(weights.reduce((s,w)=> s+w, 0)));
  const txt = String(total) + (crit ? ' CRIT' : '');
  G.floats.push({ x, y, txt, col: segs[0].col, t:1,
                  weights, segCols: segs.map(g=>g.col), crit });
  if (G.floats.length > 60) G.floats.shift();
}
function updateFloats(dt) { for (const f of G.floats) { f.t -= dt*.8; f.y -= 30*dt; } G.floats = G.floats.filter(f => f.t > 0); }

/* ---------------- camera ---------------- */
function updateCam(dt) {
  // `isoT()` treats G.cam as the WORLD POINT AT SCREEN CENTER (not a top-left corner),
  // so the camera must center on the player. Clamp to world bounds so the view stays
  // anchored to the arena when the player nears an edge.
  const tx = clamp(G.p.x, 0, WORLD.w);
  const ty = clamp(G.p.y, 0, WORLD.h);
  G.cam.x += (tx - G.cam.x) * Math.min(1, dt*6);
  G.cam.y += (ty - G.cam.y) * Math.min(1, dt*6);
}

/* ---------------- master update ---------------- */
function update(dt) {
  G.t += dt; G.flurryT = Math.max(0, G.flurryT - dt);
  G.waveBtnCd = Math.max(0, G.waveBtnCd - dt);
  const hpBefore = G.p.hp;                          // snapshot for the hit-shake below
  // stealth: tick the active timer; when it ends, arm a 5s cooldown
  if (G.stealthT > 0) {
    G.stealthT -= dt;
    if (G.stealthT <= 0) { G.stealthT = 0; G.stealthCd = 5; } // just left stealth
  }
  G.stealthCd = Math.max(0, G.stealthCd - dt);
  if (G.rageT > 0) { G.rageT -= dt; if (G.rageT <= 0) { G.rageStacks = 0; G.rageT = 0; } }
  // UNIQUE — Trinity Staff: scheduled meteor impacts + Power Surge arc flashes
  if (G.meteor) for (let i=G.meteor.length-1; i>=0; i--) { const mt=G.meteor[i]; mt.t-=dt; if (mt.t<=0){ explode(mt.x,mt.y,mt.blast,mt.dmg,'fire'); G.meteor.splice(i,1);} }
  if (G.arcs) for (let i=G.arcs.length-1; i>=0; i--) { G.arcs[i].t-=dt; if (G.arcs[i].t<=0) G.arcs.splice(i,1); }
  const p = G.p;
  p.inv = Math.max(0, p.inv - dt); p.dodgeCd -= dt;
  for (let i=0;i<3;i++) {
    const A = G.ab[i];
    if (i===0 && G.cls==='daggers') A.cd = Math.max(0, A.cd - dt * G.up.atk);
    else A.cd = Math.max(0, A.cd - dt);
  }
  const aimW = screenToWorld(mouse.x, mouse.y);       // mouse is screen-space → invert the iso
  G.aim = { x: aimW.x, y: aimW.y };
  if (EDGE.space) { EDGE.space = false;
    if (!G.over && p.dodgeCd <= 0) {
      p.dodgeCd = CFG.player.dodgeCd * (1 - G.up.dodgeCdRed); p.dodgeT = CFG.player.dodgeT;
      const d = aimDir(); p.ddx = d.dx; p.ddy = d.dy;
    }
  }
  if (EDGE.q) { EDGE.q = false; usePotion(); }
  if (EDGE.f) { EDGE.f = false; openNearbyChest(); }   // open a reliquary chest
  if (EDGE.ab1) { EDGE.ab1 = false; ability(0); }
  if (EDGE.ab2) { EDGE.ab2 = false; ability(1); }
  if (EDGE.ab3) { EDGE.ab3 = false; ability(2); }
  if (p.dodgeT > 0) {
    p.dodgeT -= dt;
    p.x += p.ddx*CFG.player.dodgeSpd*dt; p.y += p.ddy*CFG.player.dodgeSpd*dt;
  } else if (p.stunT <= 0) {      // stun locks WASD but never the dodge (your way out)
    // Screen-aligned WASD: keys track the on-screen diamond, not the world axes
    // (that's what makes iso movement feel right instead of "tweaked diagonals").
    const isx = (key.d?1:0)-(key.a?1:0), isy = (key.s?1:0)-(key.w?1:0);
    if (isx || isy) {
      // Invert the iso direction into world space. Linear part of world->screen is
      // [[a,c],[b,d]]; the input dir in world space = A^-1 * (isx,isy):
      //   wxd = isx + 2*isy ,  wyd = -isx + 2*isy   (for the 2:1 dimetric)
      let wxd = isx + 2*isy, wyd = -isx + 2*isy;
      const wl = Math.hypot(wxd, wyd) || 1; wxd/=wl; wyd/=wl;
      const tvx = moveSpd()*wxd, tvy = moveSpd()*wyd;
      const k = 1 - Math.exp(-CFG.player.accel*dt);        // accel: quick ramp to target speed
      p.vx += (tvx - p.vx)*k; p.vy += (tvy - p.vy)*k;
    } else {                                                 // friction: bleed off when released
      const fr = Math.exp(-4*dt); p.vx *= fr; p.vy *= fr;
    }
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  p.x = clamp(p.x, 20, WORLD.w-20); p.y = clamp(p.y, 20, WORLD.h-20);
  collideOBB(p);
  if (dt > 0) {                                        // velocity for predictive AI
    G.pv.x = (p.x - G._lx)/dt; G.pv.y = (p.y - G._ly)/dt;
    G._lx = p.x; G._ly = p.y;
  }
  tryAttack(dt);
  updateOrbits(dt);
  updateMobs(dt);
  updateBleeds(dt);
  updateBolts(dt);
  updateSpells(dt);
  updateOrbBalls(dt);
  updateEbolts(dt);
  updateOrbs(dt);
  updateTraps(dt);
  updateFissures(dt);
  updateSlams(dt);
  updateRings(dt);
  updatePballs(dt);
  updatePlayerDots(dt);
  updateDrops();
  updateChests();
  updateMagnet(dt);
  updateWaves(dt);
  updateFloats(dt);
  updateCam(dt);
  // ---- screen shake: fire when the player just lost HP this frame, then decay ----
  if (G.p.hp < hpBefore - 1e-6) G.shake = Math.min(14, G.shake + Math.min(10, hpBefore - G.p.hp));
  G.shake = Math.max(0, G.shake - dt*40);
}

/* =========================================================
   RENDER
========================================================= */
const c = document.getElementById('c');
const ctx = c.getContext('2d');
function resize() { c.width = innerWidth; c.height = innerHeight; }
addEventListener('resize', resize); resize();

function weaponColor(tier) {
  switch (tier) {
    case 6: return '#24e0ff';   // UNIQUE — cyan
    case 5: return '#e8310c';   // LEGENDARY — ember red
    case 4: return '#ff9f43';   // EPIC — orange
    case 3: return '#ffd23f';   // RARE — gold
    case 2: return '#58a6ff';   // UNCOMMON — blue
    default: return '#c7d2e8'; // COMMON — steel
  }
}
function weaponGlow(tier) { return tier>=3 ? 8 + tier*2 : 0; }

/* ---------------- zone visuals ---------------- */
/* pure-cosmetic dressing for the active arena (drawn before obstacles). */
function drawDecor(d, zone) {
  if (zone===0) {
    // meadow: layered ridges farthest, then soft mountains, trees, huts, drifting motes
    ctx.save();
    ctx.globalAlpha = .5;
    for (const m of d.mountains) {
      ctx.fillStyle = '#123024';
      ctx.beginPath(); ctx.moveTo(m.x-m.w/2, m.h); ctx.lineTo(m.x, 0); ctx.lineTo(m.x+m.w/2, m.h); ctx.closePath(); ctx.fill();
    }
    // NEW layered mountain ridges (2 depth bands, lighter = farther)
    if (d.ridges) {
      ctx.globalAlpha = .4;
      for (const lg of [1,0]) for (const r of d.ridges.filter(r=>r.layer===lg)) {
        ctx.fillStyle = lg ? '#0d1f16' : '#16382a';
        ctx.beginPath();
        ctx.moveTo(r.x-r.w/2, 0);
        for (let i=0;i<=4;i++){ const t=i/4;
          ctx.lineTo(r.x-r.w/2 + r.w*t, -r.h*(0.4+0.6*Math.abs(Math.sin(t*Math.PI*(1+lg))))); }
        ctx.lineTo(r.x+r.w/2, 0); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (const t of d.trees) {
      ctx.fillStyle = '#0a1f14'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,TAU); ctx.fill();
      ctx.fillStyle = '#173d27'; ctx.beginPath(); ctx.arc(t.x-t.r*.3, t.y-t.r*.3, t.r*.6, 0, TAU); ctx.fill();
    }
    if (d.huts) for (const h of d.huts) drawHut(h);     // NEW 2D iso houses
    ctx.fillStyle = '#bfe6c8';
    for (const b of d.breeze) {
      const bx = b.x + Math.sin(G.t*b.sp + b.ph)*18, by = b.y + Math.cos(G.t*b.sp*.7 + b.ph)*10;
      ctx.globalAlpha = .25 + .25*Math.sin(G.t*2 + b.ph);
      ctx.beginPath(); ctx.arc(bx,by,1.6,0,TAU); ctx.fill();
    }
    ctx.restore();
  } else if (zone===1) {
    // dungeon: standing pillars with a torch glow
    for (const p of d.pillars) {
      ctx.fillStyle = '#141b29'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
      ctx.fillStyle = '#0d1220'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*.6,0,TAU); ctx.fill();
      const fl = .5 + .5*Math.sin(G.t*7 + p.ph);
      ctx.fillStyle = 'rgba(255,160,60,'+(0.25+0.2*fl)+')'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*.9,0,TAU); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,TAU); ctx.fill();
    }
    if (d.ruins) for (const r of d.ruins) drawRuin(r);   // NEW 2D iso ruins
  } else {
    // hell: scattered bones + a slow-churning lava pool
    for (const b of d.bones) {
      ctx.strokeStyle = '#c9b89a'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+Math.cos(b.a)*b.len, b.y+Math.sin(b.a)*b.len); ctx.stroke();
      ctx.lineCap = 'butt';
    }
    for (const l of d.lava) {
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.ph);
      ctx.globalAlpha = .35; ctx.fillStyle = '#ff5a1e';
      ctx.beginPath(); ctx.ellipse(0,0,l.w,l.w*.55,0,0,TAU); ctx.fill();
      ctx.globalAlpha = .5; ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.ellipse(Math.sin(G.t*.6+l.ph)*8,0,l.w*.4,l.w*.24,0,0,TAU); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    }
    if (d.obelisks) for (const o of d.obelisks) drawObelisk(o);   // NEW 2D iso obelisks
  }
}
/* dungeon spike trap: a floor plate that lances spikes. `flash` = time left showing the strike */
function drawTrap(tr) {
  const on = tr.flash > 0;
  ctx.fillStyle = on ? '#2a1414' : '#1a2130';
  ctx.beginPath(); ctx.arc(tr.x, tr.y, tr.r, 0, TAU); ctx.fill();
  ctx.strokeStyle = on ? '#ff4d4d' : '#39496a'; ctx.lineWidth = 2; ctx.stroke();
  const spikes = 9;
  for (let i=0;i<spikes;i++){
    const a = i/spikes*TAU + 0.3;
    const ext = on ? 1 : 0.55;                     // idle: half-extended; strike: full
    const ex = tr.x + Math.cos(a)*tr.r*ext, ey = tr.y + Math.sin(a)*tr.r*ext;
    ctx.strokeStyle = on ? '#ff9f43' : '#5b6b8a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tr.x+Math.cos(a)*8, tr.y+Math.sin(a)*8); ctx.lineTo(ex,ey); ctx.stroke();
  }
  if (on) { ctx.fillStyle = 'rgba(255,80,60,.25)'; ctx.beginPath(); ctx.arc(tr.x,tr.y,tr.r,0,TAU); ctx.fill(); }
}
/* hell fissure: a glowing crack in the basalt; it throbs right before it vents */
function drawFissure(f) {
  const hot = f.pulse > 0.5;
  ctx.save(); ctx.translate(f.x,f.y); ctx.rotate(f.ang);
  ctx.strokeStyle = hot ? '#ffd23f' : '#ff5a1e'; ctx.lineWidth = hot ? 6 : 4;
  ctx.shadowColor = '#ff5a1e'; ctx.shadowBlur = hot ? 22 : 8;
  const n = 6;
  ctx.beginPath();
  for (let i=0;i<=n;i++){ const t=i/n;
    const x = -f.len/2 + f.len*t, wob = Math.sin(t*Math.PI*3 + G.t*(hot?9:2))*(hot?9:4);
    if (i===0) ctx.moveTo(x, wob); else ctx.lineTo(x, wob);
  }
  ctx.stroke();
  if (hot) { ctx.globalAlpha = .3 + .3*Math.sin(G.t*12); ctx.fillStyle = '#ff5a1e';
    ctx.beginPath(); ctx.ellipse(0,0,f.len*.5,26,0,0,TAU); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.restore(); ctx.shadowBlur = 0;
}

/* ===== 2D ISOMETRIC STRUCTURES (Diablo-flavoured, anime-animal-friendly) =====
   Huts, ruins and obelisks are drawn as extruded billboards: a sheared base
   footprint on the floor + upright walls + a roof, painter-sorted so nearer
   structures overlap farther ones. Purely cosmetic — collision stays on OBB. */
function isoBox(x, y, w, h, depth, top, wallL, wallR, roof) {
  // base footprint (sheared) then upright extruded walls then roof
  ctx.save(); const T = isoT(); ctx.setTransform(T.a,T.b,T.c,T.d,T.e,T.f);
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.beginPath(); ctx.rect(x-w/2, y-h/2, w, h); ctx.fill();     // contact shadow
  ctx.restore();
  // front wall (screen upright) — a billboard rect at the projected centre
  const P = worldToScreen(x, y);
  const sx = w*.55, sy = depth*.62;                                // screen size
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(P.x, P.y);
  // right wall (darker, recedes up-right along the iso axis)
  ctx.fillStyle = wallR; ctx.beginPath();
  ctx.moveTo(sx*.42, -sy*.5); ctx.lineTo(sx*.42+sx*.55, -sy*.5-sy*.28);
  ctx.lineTo(sx*.42+sx*.55, sy*.15-sy*.28); ctx.lineTo(sx*.42, sy*.15); ctx.closePath(); ctx.fill();
  // front wall
  ctx.fillStyle = wallL; ctx.fillRect(-sx*.42, -sy*.5, sx*.84, sy);
  // roof (two slabs meeting at a ridge)
  ctx.fillStyle = roof; ctx.beginPath();
  ctx.moveTo(-sx*.5, -sy*.45); ctx.lineTo(sx*.42+sx*.55, -sy*.5-sy*.28);
  ctx.lineTo(sx*.42+sx*.55-sx*.1, -sy*.95); ctx.lineTo(-sx*.5-sx*.1, -sy*.95+sy*.1);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawHut(h) {
  // 3 variants: thatched-hut, dusk-cabin, blue-slate dwelling
  const pal = [
    { roof:'#3a2418', wallL:'#5a4030', wallR:'#3a2a1e' },
    { roof:'#4a3050', wallL:'#6a4a70', wallR:'#44304a' },
    { roof:'#2d4a5a', wallL:'#3f5a68', wallR:'#26383f' }
  ][h.kind%3];
  floorShadow(h.x, h.y, 40);          // sheared ellipse contact shadow, correct position
  isoBox(h.x, h.y, 90*h.scale, 80*h.scale, 70, null, pal.wallL, pal.wallR, pal.roof);
  if (h.chimney) {                   // a soft smoke wisp (anime touch)
    const P = worldToScreen(h.x, h.y);
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.globalAlpha = .25 + .12*Math.sin(G.t*1.5+h.kind);
    ctx.fillStyle = '#cfd8e6';
    for (let i=0;i<3;i++){ const w=Math.sin(G.t*1.2+i)*6;
      ctx.beginPath(); ctx.arc(P.x+10+w, P.y-52-i*14, 4+i*1.5, 0, TAU); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
}
function drawRuin(r) {
  // broken column, crumbled arch, or toppled slab
  const P = worldToScreen(r.x, r.y);
  floorShadow(r.x, r.y, 26);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(P.x, P.y); ctx.rotate(r.rot*.4);
  const col = r.kind===0 ? ['#2a3444','#3a4a66'] : r.kind===1 ? ['#4a3d24','#6a5a34'] : ['#3a2e2e','#5a4a4a'];
  if (r.kind===0) {  // broken column (3 stumps)
    for (let i=0;i<3;i++){ const dx=(i-1)*14, hh=r.broken? R(18,30):R(34,44);
      ctx.fillStyle = col[i%2]; ctx.fillRect(dx-6, -hh, 12, hh); }
  } else if (r.kind===1) {  // crumbling arch
    ctx.strokeStyle = col[1]; ctx.lineWidth = 6; ctx.beginPath();
    ctx.arc(0, -8, 20, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    ctx.fillStyle = col[0]; ctx.fillRect(-22,-8,8,8); ctx.fillRect(14,-8,8,8);
  } else {   // toppled slab
    ctx.fillStyle = col[0]; ctx.fillRect(-16,-8,34,12);
    ctx.fillStyle = col[1]; ctx.fillRect(-16,-8,34,4);
  }
  ctx.restore();
}
function drawObelisk(o) {
  const P = worldToScreen(o.x, o.y);
  const h = o.h, glow = .3 + .25*Math.sin(G.t*2+o.glow);
  floorShadow(o.x, o.y, 26);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(P.x, P.y);
  ctx.shadowColor = '#ff5a1e'; ctx.shadowBlur = 10*glow;
  // angular pyramid/obelisk in 4 shades (anime-geometric)
  ctx.fillStyle = '#1a0f0d'; ctx.beginPath();
  ctx.moveTo(0,-h); ctx.lineTo(h*.3,0); ctx.lineTo(-h*.3,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1512'; ctx.beginPath();
  ctx.moveTo(0,-h); ctx.lineTo(h*.3,0); ctx.lineTo(h*.12,-h*.08); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  // glowing rune
  ctx.fillStyle = 'rgba(255,120,40,'+glow+')';
  ctx.beginPath(); ctx.arc(0,-h*.55, h*.1, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ===== isometric 2:1 dimetric projection (render + aim) =====
   World simulation runs in square space; only drawing and mouse->aim use this.
   screen_x = ISO*(wx-wy) + cx,  screen_y = ISO/2*(wx+wy) + cy  (centered). */
const ISO = 0.5;
function isoT() {
  // bake in the hit-shake jitter (world space) so the scene shakes per-frame
  const cx = G.cam.x + G._shx, cy = G.cam.y + G._shy;
  return {
    a:ISO, b:ISO/2, c:-ISO, d:ISO/2,
    e:c.width/2 - ISO*(cx-cy),
    f:c.height/2 - ISO/2*(cx+cy)
  };
}
function setIso() { const T = isoT(); ctx.setTransform(T.a,T.b,T.c,T.d,T.e,T.f); }
function resetIso() { ctx.setTransform(1,0,0,1,0,0); }
function worldToScreen(wx,wy){ const T=isoT(); return { x:T.a*wx+T.c*wy+T.e, y:T.b*wx+T.d*wy+T.f }; }
function screenToWorld(sx,sy){
  const T=isoT(); const det=T.a*T.d-T.c*T.b;
  const px=sx-T.e, py=sy-T.f;
  return { x:(px*T.d - T.c*py)/det, y:(T.a*py - T.b*px)/det };
}
/* D2-style billboards: a character stands UPRIGHT on the sheared floor.
   `lift` raises the body so its feet rest on the projected floor point. */
function drawAt(wx, wy, lift, fn) {
  const s = worldToScreen(wx, wy);
  ctx.save();
  ctx.setTransform(1,0,0,1,0,0);            // identity: draw upright, no shear
  ctx.translate(s.x, s.y - (lift||0));
  fn();
  ctx.restore();
}
/* soft contact shadow: draw a plain world-space CIRCLE under the 2:1 shear and
   the projection turns it into the correct ground ellipse (SSR — never hand-
   squash a decal, let the projection do the foreshortening). */
function floorShadow(wx, wy, rw) {
  const T = isoT();
  ctx.save(); ctx.setTransform(T.a,T.b,T.c,T.d,T.e,T.f);
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.arc(wx, wy, rw, 0, TAU); ctx.fill();
  ctx.restore();
}
