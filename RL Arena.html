    ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 22px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(t('pause_tag'), c.width/2, c.height/2);
    ctx.textAlign='left';
  }
  hud(); mini();
}

let idleT = 0;
function titleIdle() {
  idleT += .016;
  ctx.fillStyle = '#0a0d14'; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle = '#0e1524'; ctx.lineWidth = 1;
  const gs = 60;
  for (let x=(idleT*12)%gs; x<c.width; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,c.height); ctx.stroke(); }
}

function drawMob(m) {
  const cc = CFG.mobs[m.rarity];
  const bob = Math.sin(G.t*3 + m.seed)*2;
  const col = m.col || cc.col;                 // per-mob randomized colour
  const P = worldToScreen(m.x, m.y);            // D2 billboard: stand upright on the floor
  const body = m.hitT > 0 ? '#ffffff' : '#131a2a';
  // 1) floor elements (sheared, SSR — let the projection make the ellipse): contact shadow + DoT / chill rings
  floorShadow(m.x, m.y, m.r*0.9);
  if (m.dots || m.slowT > 0) {
    ctx.save(); const T = isoT(); ctx.setTransform(T.a,T.b,T.c,T.d,T.e,T.f);
    ctx.globalAlpha = .55;
    for (const type of ['bleed','fire','cold']) {
      const active = (m.dots && m.dots[type]) || (type==='cold' && m.slowT > 0);
      if (!active) continue;
      ctx.strokeStyle = DOT_COL[type]; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r+3, 0, TAU); ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // 2) upright billboard body (identity transform → NOT sheared with the floor)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(P.x, P.y - m.r*0.5 + bob);
  if (cc.glow || m.boss) { ctx.shadowColor = col; ctx.shadowBlur = 16; }

  if (m.boss) {
    const r = m.r, sq = 1 + Math.sin(G.t*2 + m.seed)*0.04;
    if (m.btype === 'b1') {
      // ADULT DRAGON: scaly, winged, two horns, an open fire-lit jaw
      ctx.fillStyle = '#0d1322';
      for (const s of [-1,1]) { ctx.beginPath(); ctx.ellipse(s*r*.5, r*.78, r*.24, r*.16, 0,0,TAU); ctx.fill(); }
      for (const s of [-1,1]) {
        const flap = Math.sin(G.t*4 + m.seed)*r*.18;
        ctx.fillStyle = 'rgba(200,120,60,.35)'; ctx.beginPath();
        ctx.moveTo(s*r*.5,-r*.2); ctx.lineTo(s*r*1.7, -r*.9+flap); ctx.lineTo(s*r*1.1, r*.1); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth=2; ctx.stroke();
      }
      for (const s of [-1,1]) { ctx.fillStyle = col; ctx.beginPath();
        ctx.moveTo(s*r*.4,-r*.7); ctx.lineTo(s*r*.75,-r*1.5); ctx.lineTo(s*r*.2,-r*.85); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0,0,r, r*1.1*sq, 0,0,TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.strokeStyle = col; ctx.lineWidth=3; ctx.stroke();
      ctx.fillStyle = 'rgba(255,120,50,.25)';
      for (let i=0;i<4;i++){ ctx.beginPath(); ctx.arc(0, r*.2+i*r*.18, r*.5, 0, Math.PI); ctx.fill(); }
      ctx.fillStyle = '#ff9f43'; ctx.shadowColor='#ff5a1e'; ctx.shadowBlur=12;
      ctx.beginPath(); ctx.ellipse(0, r*.75, r*.32, r*.16, 0,0,TAU); ctx.fill(); ctx.shadowBlur=0;
      for (const s of [-1,1]) { ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(s*r*.42,-r*.35,r*.13,0,TAU); ctx.fill();
        ctx.fillStyle='#0a0f1e'; ctx.beginPath(); ctx.arc(s*r*.42,-r*.35,r*.06,0,TAU); ctx.fill(); }
    } else if (m.btype === 'b2') {
      // SKELETON KING: bone-white skull, a spiky crown, glowing eyes, a jaw
      ctx.fillStyle = 'rgba(180,190,210,.28)'; ctx.beginPath(); ctx.ellipse(0,0,r*1.05, r*1.2, 0,0,TAU); ctx.fill();
      ctx.fillStyle = '#cfd8e6'; ctx.beginPath();
      for (let i=0;i<5;i++){ const a=-Math.PI/2 + (i-2)*.5;
        ctx.moveTo(0,-r*.2); ctx.lineTo(Math.cos(a)*r*1.5, -r*.2+Math.sin(a)*r*1.3); }
      ctx.fill();
      ctx.fillStyle = m.hitT>0?'#fff':'#dfe6f0'; ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
      ctx.shadowBlur = 0; ctx.strokeStyle = '#8a93a8'; ctx.lineWidth=3; ctx.stroke();
      for (const s of [-1,1]) { ctx.fillStyle = col; ctx.shadowColor=col; ctx.shadowBlur=10;
        ctx.beginPath(); ctx.arc(s*r*.4,-r*.25,r*.15,0,TAU); ctx.fill(); }
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#dfe6f0'; ctx.lineWidth=4; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-r*.4,r*.35); ctx.lineTo(r*.4,r*.35); ctx.stroke();
      for (let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(i*r*.15,r*.35); ctx.lineTo(i*r*.15,r*.55); ctx.stroke(); }
      ctx.lineCap='butt';
    } else {
      // VAMPIRE LORD: cloaked figure, tall collar, fangs, flowing cape
      ctx.fillStyle = 'rgba(90,15,30,.5)'; ctx.beginPath();
      ctx.moveTo(0,-r*.6);
      ctx.bezierCurveTo(-r*1.5, r*.4, -r*.9, r*1.3, -r*.3, r*1.05);
      ctx.lineTo(r*.3, r*1.05);
      ctx.bezierCurveTo(r*.9, r*1.3, r*1.5, r*.4, 0, -r*.6); ctx.fill();
      ctx.fillStyle = '#3a0a12'; ctx.beginPath();
      ctx.moveTo(-r*.9,-r*.4); ctx.lineTo(0,-r*1.05); ctx.lineTo(r*.9,-r*.4); ctx.lineTo(r*.6,r*.1); ctx.lineTo(-r*.6,r*.1); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth=2; ctx.stroke();
      ctx.fillStyle = m.hitT>0?'#fff':'#c9a9ad'; ctx.beginPath(); ctx.arc(0,-r*.05,r*.62,0,TAU); ctx.fill();
      ctx.shadowBlur = 0;
      for (const s of [-1,1]) { ctx.fillStyle = col; ctx.shadowColor=col; ctx.shadowBlur=8;
        ctx.beginPath(); ctx.arc(s*r*.26,-r*.15,r*.1,0,TAU); ctx.fill(); }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(-r*.16,r*.18); ctx.lineTo(-r*.08,r*.34); ctx.lineTo(-.02,r*.18); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r*.16,r*.18); ctx.lineTo(r*.08,r*.34); ctx.lineTo(r*.02,r*.18); ctx.fill();
    }
  } else {
    // ---- ANIME / ANIMAL CREATURES: each rarity reads as a distinct critter ----
    const r = m.r;
    ctx.fillStyle = body; ctx.strokeStyle = col; ctx.lineWidth = 2;
    const drawPoly = (n, rot) => {
      ctx.beginPath();
      for (let i=0;i<n;i++){ const a = rot + i*TAU/n; const X=Math.cos(a)*r, Y=Math.sin(a)*r; i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);} ctx.closePath();
    };
    switch (m.shape) {
      case 'square':  ctx.fillRect(-r,-r,r*2,r*2); ctx.strokeRect(-r,-r,r*2,r*2); break;
      case 'tri':     drawPoly(3,-Math.PI/2); ctx.fill(); ctx.stroke(); break;
      case 'diamond': drawPoly(4,-Math.PI/2); ctx.fill(); ctx.stroke(); break;
      case 'hex':     drawPoly(6,0);           ctx.fill(); ctx.stroke(); break;
      case 'star':    drawPoly(8,-Math.PI/2); ctx.fill(); ctx.stroke(); break;
      case 'blob': { ctx.beginPath(); for (let a=0;a<=TAU+.01;a+=.4){ const rr=r*(1+Math.sin(a*3+m.seed)*.18); const X=Math.cos(a)*rr,Y=Math.sin(a)*rr; a?ctx.lineTo(X,Y):ctx.moveTo(X,Y);} ctx.closePath(); ctx.fill(); ctx.stroke(); break; }
      default:        ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill(); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    // rarity-specific animal features (anime silhouettes)
    const rarityFeat = {
      normal:  rr => {   // imp / rat: two pointy ears
        ctx.fillStyle = body; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        for (const s of [-1,1]) { ctx.beginPath();
          ctx.moveTo(s*rr*.4,-rr*.7); ctx.lineTo(s*rr*.72,-rr*1.18); ctx.lineTo(s*rr*.15,-rr*.85);
          ctx.closePath(); ctx.fill(); ctx.stroke(); }
      },
      elite:   rr => {   // bat: flapping wings
        const flap = Math.sin(G.t*6 + m.seed)*rr*.28;
        ctx.fillStyle = col; ctx.globalAlpha = .8;
        for (const s of [-1,1]) { ctx.beginPath();
          ctx.moveTo(s*rr*.4, -rr*.1); ctx.lineTo(s*rr*1.7, -rr*.5 + flap*s);
          ctx.lineTo(s*rr*1.1, rr*.3 - flap*s*.5); ctx.closePath(); ctx.fill(); }
        ctx.globalAlpha = 1;
      },
      raro:    rr => {   // wolf / wyvern: horns + fangs
        ctx.strokeStyle = col; ctx.lineWidth = 2;
        for (const s of [-1,1]) { ctx.beginPath();
          ctx.moveTo(s*rr*.4,-rr*.8); ctx.lineTo(s*rr*.7,-rr*1.35); ctx.lineTo(s*rr*.2,-rr*.95); ctx.stroke(); }
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.moveTo(-rr*.2,rr*.5); ctx.lineTo(-rr*.12,rr*.8); ctx.lineTo(-rr*.04,rr*.5); ctx.fill();
        ctx.beginPath(); ctx.moveTo(rr*.2,rr*.5); ctx.lineTo(rr*.12,rr*.8); ctx.lineTo(rr*.04,rr*.5); ctx.fill();
      },
      mitico:  rr => {   // spectral: wispy glowing tail
        ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.globalAlpha = .6;
        for (let i=0;i<3;i++){ const w=Math.sin(G.t*3+i)*rr*.3;
          ctx.beginPath(); ctx.moveTo(0,rr*.6); ctx.quadraticCurveTo(w, rr*1.1, -w, rr*1.5); ctx.stroke(); }
        ctx.globalAlpha = 1;
      }
    };
    const feat = rarityFeat[m.rarity]; if (feat) feat(r);
    // anime eyes (all creatures): tinted sclera + dark pupil + highlight
    const ec = { normal:'#cfe8ff', elite:'#ffe9a8', raro:'#ffd0e8', mitico:'#c8b8ff' }[m.rarity] || '#fff';
    for (const s of [-1,1]) {
      ctx.fillStyle = ec; ctx.beginPath(); ctx.ellipse(s*r*.32, -r*.12, r*.2, r*.26, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#10131f'; ctx.beginPath(); ctx.arc(s*r*.32, -r*.1, r*.1, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s*r*.32 - r*.03, -r*.14, r*.035, 0, TAU); ctx.fill();
    }
  }

  if (m.wt > 0) {
    ctx.strokeStyle = '#ff5d5d'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0,0,m.r+7,-Math.PI/2, TAU*(1 - m.wt/.35)); ctx.stroke();
  }
  ctx.restore();
  if (m.hp < m.maxHp || m.boss) {
    // upright HP bar / boss banner, floating above the sprite at its projected position
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    const w = m.r*2.4;
    const hx = P.x, hy = P.y - m.r*0.6 - 8;
    ctx.fillStyle = '#0a0f1a'; ctx.fillRect(hx-w/2, hy, w, 4);
    ctx.fillStyle = m.boss ? '#ffd23f' : '#e05252';
    ctx.fillRect(hx-w/2, hy, w*(m.hp/m.maxHp), 4);
    if (m.boss) {   // name banner above the boss HP bar
      const nm = t('bname_' + (m.btype==='b1'?'1':m.btype==='b2'?'2':'3'));
      ctx.font = 'bold 12px Segoe UI'; ctx.textAlign = 'center';
      const tw = ctx.measureText(nm).width;
      ctx.fillStyle = 'rgba(6,8,14,.7)';
      ctx.fillRect(hx-tw/2-8, hy-18, tw+16, 16);
      ctx.fillStyle = m.btype==='b1'?'#ff9f43' : m.btype==='b2'?'#cfd8e6' : '#ff4d6d';
      ctx.fillText(nm, hx, hy-6);
    }
    ctx.restore();
  }
}

function drawCat() {
  const cat = G.cat;
  if (!cat.on) return;
  const bob = Math.sin(G.t*3)*2;
  // approach hint ring when you're within shop range (stays sheared on the floor)
  const near = d2(G.p.x, G.p.y, cat.x, cat.y) <= SHOP.near*SHOP.near;
  if (near) {
    const T = isoT(); ctx.save(); ctx.setTransform(T.a,T.b,T.c,T.d,T.e,T.f);
    ctx.strokeStyle = 'rgba(255,210,63,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cat.x, cat.y, SHOP.near, 0, TAU); ctx.stroke();
    ctx.restore();
  }
  // little cat billboarded upright at its projected floor point
  const P = worldToScreen(cat.x, cat.y);
  floorShadow(cat.x, cat.y, 15);
  drawAt(cat.x, cat.y, 12, () => {
    const y = bob;
    ctx.fillStyle = '#3a4152';
    ctx.beginPath(); ctx.ellipse(0, y, 15, 12, 0, 0, TAU); ctx.fill();          // body
    ctx.beginPath(); ctx.arc(8, y-9, 9, 0, TAU); ctx.fill();                     // head
    ctx.beginPath(); ctx.moveTo(2, y-15); ctx.lineTo(6, y-22); ctx.lineTo(9, y-15); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(11, y-15); ctx.lineTo(14, y-21); ctx.lineTo(16, y-14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#3a4152'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-13, y); ctx.quadraticCurveTo(-24, y-6, -20, y-16); ctx.stroke();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(6, y-9, 1.6, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(12, y-9, 1.6, 0, TAU); ctx.fill();
    // upright vendor marker + open-hint
    ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 12px Segoe UI'; ctx.textAlign = 'center';
    ctx.fillText('$', 0, -24 + bob);
    if (near) { ctx.fillStyle = '#ffd23f'; ctx.font = 'bold 13px Segoe UI';
      ctx.fillText(t('shop_b_open'), 0, 28 + bob); }
    ctx.textAlign = 'left';
  });
}

function drawOrbitBlades() {
  if (G.cls !== 'daggers' || G.up.orbit <= 0) return;
  const p = G.p, rad = orbitRadius(), n = G.up.orbit;
  ctx.save();
  ctx.shadowColor = weaponColor(weaponTier()) || '#c7d2e8';
  ctx.shadowBlur = 8 + weaponGlow(weaponTier());
  for (let i=0; i<n; i++) {
    const a = G.orbAngle + i*(TAU/n);
    const bx = p.x + Math.cos(a)*rad, by = p.y + Math.sin(a)*rad;
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(a + Math.PI/2);
    ctx.fillStyle = '#e6f0ff';
    ctx.beginPath();
    ctx.moveTo(0,-7); ctx.lineTo(3,4); ctx.lineTo(-3,4); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  // faint orbit ring
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(159,178,216,.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, TAU); ctx.stroke();
  ctx.restore();
}
function drawStealthAura() {
  if (G.stealthT <= 0) return;
  const p = G.p;
  const pulse = 0.5 + Math.sin(G.t*8)*0.3;
  ctx.save();
  ctx.strokeStyle = 'rgba(88,166,255,' + (0.4*pulse) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 12 + pulse*4, 0, TAU); ctx.stroke();
  // dim the player body to signal stealth
  ctx.globalAlpha = 0.55;
  ctx.restore();
}
function drawPlayer() {
  const p = G.p;
  const P = worldToScreen(p.x, p.y);
  const aim = Math.atan2(G.aim.y-p.y, G.aim.x-p.x);
  // ---- floor-level elements (sheared, SSR): contact shadow + dodge ring + orbit blades + swing arc
  floorShadow(p.x, p.y, p.r*0.9);
  ctx.save(); const T = isoT(); ctx.setTransform(T.a,T.b,T.c,T.d,T.e,T.f);
  if (p.dodgeT > 0) {
    ctx.strokeStyle = 'rgba(159,178,216,.7)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r+7, 0, TAU); ctx.stroke();
  }
  drawOrbitBlades();
  drawStealthAura();
  if (G.cls === 'daggers' && G.swT > 0) {
    ctx.strokeStyle = 'rgba(230,240,255,.6)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x,p.y,CFG.weapons.daggers.reach, aim-1.1, aim+1.1); ctx.stroke();
  }
  ctx.restore();
  // ---- upright body billboard + HP bar (identity transform, standing on the floor)
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.translate(P.x, P.y - p.r*0.5);
  if (G.stealthT > 0) ctx.globalAlpha = 0.6;
  ctx.save(); ctx.rotate(aim);
  drawHero(ctx, G.cls, p, weaponTier(), G.t);   // class-specific D2-style hero billboard
  ctx.restore();
  ctx.globalAlpha = 1;
  const w = 30;
  ctx.fillStyle = '#0a0f1a'; ctx.fillRect(-w/2, -p.r-12, w, 4);
  ctx.fillStyle = '#7ee787'; ctx.fillRect(-w/2, -p.r-12, w*(p.hp/maxHp()), 4);
  ctx.restore();
}

function drawWeaponTier(tier) {
  const col = weaponColor(tier);
  const glow = weaponGlow(tier);
  ctx.save();
  if (glow) { ctx.shadowColor = col; ctx.shadowBlur = glow; }
  if (tier >= 4) {
    ctx.strokeStyle = tier===6 ? '#24e0ff' : tier===5 ? '#e8310c' : '#ff9f43'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(12, 0, 9, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(12, 0, 14, -0.5, 0.5); ctx.stroke();
  }
  ctx.fillStyle = col;
  ctx.fillRect(10,-9,13,4); ctx.fillRect(10,5,13,4);
  if (tier === 2) { ctx.fillStyle = 'rgba(88,166,255,.4)'; ctx.fillRect(12,-8,9,2); ctx.fillRect(12,6,9,2); }
  if (tier >= 4) {
    const fl = 0.5 + Math.sin(G.t*10)*0.5;
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = tier===6 ? '#7ff0ff' : tier===5 ? '#ff6a3a' : '#ffb340';
    ctx.beginPath(); ctx.moveTo(23,-7); ctx.lineTo(30 + fl*4, -2); ctx.lineTo(23, 1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(23,7); ctx.lineTo(30 + fl*4, 2); ctx.lineTo(23, -1); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* ===================== HERO SPRITES (3 classes) =====================
   D2 / Path of Exile / Hero-Siege style vectorized hero billboards.
   Each is drawn at local origin, already rotated to `aim` (forward = +x).
   Used in drawPlayer and in the title-screen class previews. */
function drawHero(cx, cls, p, wtier, t) {
  const r = p.r, gl = weaponColor(wtier), ga = weaponGlow(wtier);
  cx.save(); cx.translate(0, Math.sin(t*2.2)*1.2);   // gentle idle bob
  if (cls === 'crossbow') {
    // ---- RANGER: broad green ranger, crossbow forward, quiver on the back
    cx.save(); cx.translate(-r*0.55, -r*0.25); cx.rotate(0.5);   // quiver (back = -x)
    cx.fillStyle = '#3a2a18'; cx.fillRect(-2, -r*0.7, 4, r*1.3);
    cx.strokeStyle = '#ffcf4a'; cx.lineWidth = 1;
    for (let i=0;i<3;i++){ const yy=-r*0.5+i*r*0.35;
      cx.beginPath(); cx.moveTo(-1.5,yy); cx.lineTo(1.5,yy-r*0.25); cx.stroke(); }
    cx.restore();
    cx.fillStyle = '#1c2a22';                                 // cloak
    cx.beginPath(); cx.moveTo(-r*0.6,-r*0.4);
    cx.quadraticCurveTo(-r*1.25, r*0.3, -r*0.5, r*0.95);
    cx.lineTo(r*0.55, r*0.8); cx.quadraticCurveTo(r*1.0, r*0.1, r*0.55, -r*0.4);
    cx.closePath(); cx.fill();
    cx.fillStyle = '#2c4a38'; cx.beginPath(); cx.ellipse(0,0,r*0.72, r*0.82, 0,0,TAU); cx.fill();  // broad torso
    cx.strokeStyle = '#ffcf4a'; cx.lineWidth = 1.5; cx.globalAlpha=.55; cx.stroke(); cx.globalAlpha=1;
    cx.fillStyle = '#3c5c48';
    cx.beginPath(); cx.arc(-r*0.5,-r*0.45,r*0.22,0,TAU); cx.fill();
    cx.beginPath(); cx.arc(r*0.5,-r*0.45,r*0.22,0,TAU); cx.fill();                       // pauldrons
    cx.fillStyle = '#d9b48a'; cx.beginPath(); cx.arc(r*0.32,-r*0.5,r*0.42,0,TAU); cx.fill();   // head
    cx.fillStyle = '#2c4a38'; cx.beginPath(); cx.arc(r*0.32,-r*0.62,r*0.42, Math.PI*1.05, Math.PI*1.95); cx.fill(); // cap
    cx.fillStyle = '#1a1a1a'; cx.beginPath(); cx.arc(r*0.5,-r*0.52,r*0.07,0,TAU); cx.fill();          // eye
    cx.shadowColor = gl; cx.shadowBlur = ga;                     // crossbow forward
    cx.strokeStyle = gl; cx.lineWidth = 2;
    cx.beginPath(); cx.arc(r*0.95, 0, r*0.5, -1.15, 1.15); cx.stroke();
    cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(r*0.35, -r*0.5); cx.lineTo(r*0.35, r*0.5); cx.stroke();
    cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(r*0.35,0); cx.lineTo(r*1.5,0); cx.stroke();
    cx.shadowBlur = 0;
  }
  else if (cls === 'mage') {
    // ---- MAGE: flowing violet robe, staff with a glowing orb, arcane ring
    cx.save(); cx.globalAlpha = .5 + .3*Math.sin(t*3);
    cx.strokeStyle = '#66e0ff'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.ellipse(0, r*0.55, r*1.15, r*0.5, 0, 0, TAU); cx.stroke(); cx.restore();
    const grd = cx.createLinearGradient(0,-r, 0, r);
    grd.addColorStop(0,'#4a2a7a'); grd.addColorStop(1,'#241240');
    cx.fillStyle = grd;                                            // robe skirt
    cx.beginPath(); cx.moveTo(-r*0.25,-r*0.6);
    cx.quadraticCurveTo(-r*1.15, r*0.9, -r*0.7, r*1.0);
    cx.lineTo(r*0.7, r*1.0); cx.quadraticCurveTo(r*1.15, r*0.9, r*0.25,-r*0.6);
    cx.closePath(); cx.fill();
    cx.strokeStyle = '#66e0ff44'; cx.lineWidth = 1.5; cx.stroke();
    cx.strokeStyle = '#ffd23f'; cx.lineWidth = 1;                 // gold trim
    cx.beginPath(); cx.moveTo(-r*0.55,r*0.55); cx.lineTo(r*0.55,r*0.55); cx.stroke();
    cx.fillStyle = '#efe6ff'; cx.beginPath(); cx.arc(r*0.22,-r*0.55,r*0.4,0,TAU); cx.fill();  // face
    cx.fillStyle = '#3a1f5c'; cx.beginPath(); cx.arc(r*0.22,-r*0.62,r*0.42, Math.PI*0.9, Math.PI*2.1); cx.fill(); // hood
    cx.fillStyle = '#66e0ff'; cx.shadowColor = '#66e0ff'; cx.shadowBlur = 5;
    cx.beginPath(); cx.arc(r*0.4,-r*0.5,r*0.08,0,TAU); cx.fill();
    cx.shadowBlur = 0;
    cx.shadowColor = gl; cx.shadowBlur = ga;                       // staff + orb forward
    cx.strokeStyle = '#c8b48a'; cx.lineWidth = 2.2;
    cx.beginPath(); cx.moveTo(r*0.3, r*0.7); cx.lineTo(r*1.35, -r*0.5); cx.stroke();
    cx.fillStyle = gl; cx.beginPath(); cx.arc(r*1.4, -r*0.55, r*0.32, 0, TAU); cx.fill();
    cx.fillStyle = '#fff'; cx.globalAlpha = .7;
    cx.beginPath(); cx.arc(r*1.4, -r*0.55, r*0.12, 0, TAU); cx.fill();
    cx.globalAlpha = 1; cx.shadowBlur = 0;
  }
  else {
    // ---- ASSASSIN (daggers): slim crouched, red hood, twin forward blades
    cx.fillStyle = '#0f1420';
    cx.beginPath(); cx.moveTo(-r*0.5,-r*0.45);
    cx.quadraticCurveTo(-r*1.2, r*0.25 + Math.sin(t*5)*r*0.08, -r*0.35, r*0.95);
    cx.lineTo(r*0.5, r*0.85); cx.quadraticCurveTo(r*0.85, r*0.1, r*0.4, -r*0.4);
    cx.closePath(); cx.fill();
    cx.fillStyle = '#1b2334'; cx.beginPath(); cx.ellipse(0, r*0.05, r*0.58, r*0.8, 0, 0, TAU); cx.fill(); // narrow torso
    cx.strokeStyle = '#ff3d6e'; cx.lineWidth = 1.8;               // chest straps
    cx.beginPath(); cx.moveTo(-r*0.45,-r*0.25); cx.lineTo(r*0.4, r*0.4); cx.stroke();
    cx.beginPath(); cx.moveTo(-r*0.4,r*0.4); cx.lineTo(r*0.45,-r*0.25); cx.stroke();
    cx.fillStyle = '#141b2b'; cx.beginPath(); cx.arc(r*0.12,-r*0.5,r*0.5,0,TAU); cx.fill();   // hood
    cx.strokeStyle = '#ff3d6e55'; cx.lineWidth = 1.4; cx.stroke();
    cx.fillStyle = '#7ee7ff'; cx.shadowColor = '#7ee7ff'; cx.shadowBlur = 5;                  // two eyes
    cx.beginPath(); cx.arc(r*0.35,-r*0.6,r*0.09,0,TAU); cx.fill();
    cx.beginPath(); cx.arc(r*0.5,-r*0.42,r*0.09,0,TAU); cx.fill();
    cx.shadowBlur = 0;
    cx.shadowColor = gl; cx.shadowBlur = ga;                       // twin daggers
    cx.fillStyle = gl;
    for (const s of [-1,1]) {
      cx.save(); cx.translate(r*0.55, s*r*0.22);
      cx.beginPath(); cx.moveTo(0, s*r*0.02); cx.lineTo(r*0.85, 0); cx.lineTo(r*0.6, s*r*0.12); cx.closePath(); cx.fill();
      cx.restore();
    }
    cx.shadowBlur = 0;
  }
  cx.restore();
}

/* ===================== ITEM GLYPHS (D2R / PoE style) ===================== */
function rr(cx,x,y,w,h,rad){
  if (cx.roundRect){ cx.beginPath(); cx.roundRect(x,y,w,h,rad); }
  else { cx.beginPath(); cx.moveTo(x+rad,y);
    cx.arcTo(x+w,y,x+w,y+h,rad); cx.arcTo(x+w,y+h,x,y+h,rad);
    cx.arcTo(x,y+h,x,y,rad); cx.arcTo(x,y,x+w,y,rad); cx.closePath(); }
}
function drawTypeGlyph(cx, slot, cls, col){
  cx.save(); cx.fillStyle = col; cx.strokeStyle = col; cx.lineWidth = 1.6;
  if (slot === 'armor') {
    cx.beginPath(); cx.moveTo(-6,-6); cx.lineTo(6,-6); cx.lineTo(5,3); cx.lineTo(0,7); cx.lineTo(-5,3); cx.closePath();
    cx.globalAlpha=.9; cx.fill(); cx.globalAlpha=1;
    cx.beginPath(); cx.moveTo(0,-6); cx.lineTo(0,6); cx.stroke();
  } else if (slot === 'amulet') {
    cx.beginPath(); cx.arc(0,0,1.7,0,TAU); cx.fill();
    cx.beginPath(); cx.arc(0,1.5,4.2,-2.6,0.7); cx.stroke();
    cx.strokeStyle='#fff'; cx.lineWidth=.8; cx.beginPath(); cx.moveTo(-1.2,-2.2); cx.lineTo(1.6,0.4); cx.stroke();
  } else {
    if (cls === 'crossbow') {
      cx.beginPath(); cx.arc(0,0,5.5,-1.9,1.9); cx.stroke();
      cx.beginPath(); cx.moveTo(-5.5,0); cx.lineTo(4,0); cx.stroke();
      cx.beginPath(); cx.moveTo(0,-4); cx.lineTo(0,4); cx.stroke();
    } else if (cls === 'mage') {
      cx.lineWidth=2; cx.beginPath(); cx.moveTo(-4,6); cx.lineTo(5,-4); cx.stroke();
      cx.beginPath(); cx.arc(5,-4,2.4,0,TAU); cx.fill();
    } else {
      cx.beginPath(); cx.moveTo(-1,5); cx.lineTo(-4,-4); cx.lineTo(-1,-6); cx.lineTo(1,-4); cx.closePath(); cx.fill();
      cx.globalAlpha=.55; cx.beginPath(); cx.moveTo(1,5); cx.lineTo(4,-4); cx.lineTo(1,-6); cx.lineTo(-1,-4); cx.closePath(); cx.fill(); cx.globalAlpha=1;
    }
  }
  cx.restore();
}
/* rarity-framed item icon, centered at 0,0 (D2R pickup look). `d` = drop/item. */
function drawItemGlyph(cx, d){
  const col = CFG.irColor[d.rar], legend = d.legend;
  const w = 18, h = 18;
  cx.save();
  cx.shadowColor = col; cx.shadowBlur = legend ? 16 : 7;
  cx.fillStyle = '#0a0f1e'; rr(cx,-w/2,-h/2,w,h,4); cx.fill();
  cx.shadowBlur = 0;
  cx.strokeStyle = col; cx.lineWidth = legend ? 2.4 : 1.5; rr(cx,-w/2,-h/2,w,h,4); cx.stroke();
  if (legend){ cx.strokeStyle = 'rgba(255,255,255,.35)'; cx.lineWidth = 1; rr(cx,-w/2+3,-h/2+3,w-6,h-6,2); cx.stroke(); }
  cx.translate(0,-1);
  drawTypeGlyph(cx, d.slot, G.cls, col);
  if (legend){
    cx.fillStyle = '#fff'; cx.shadowColor = '#fff'; cx.shadowBlur = 4;
    cx.beginPath(); cx.moveTo(0,-h/2-1); cx.lineTo(2,-h/2+1.5); cx.lineTo(0,-h/2+3.5); cx.lineTo(-2,-h/2+1.5); cx.closePath(); cx.fill();
    cx.shadowBlur = 0;
  }
  cx.restore();
}

/* paint the mini item-glyph into a HUD slot's canvas icon (equipped item, or the
   empty-slot type glyph at low alpha) */
function paintSlotIcon(el, slot, item){
  const cv = el.querySelector('canvas.slotIcon');
  if (!cv) return;
  const cx2 = cv.getContext('2d');
  cx2.clearRect(0,0,cv.width,cv.height);
  cx2.save(); cx2.translate(cv.width/2, cv.height/2);
  cx2.scale(0.9, 0.9);
  if (item) {
    drawItemGlyph(cx2, item);
  } else {
    // empty slot: faint type glyph so the slot still reads (PoE style)
    cx2.globalAlpha = .35;
    drawTypeGlyph(cx2, slot, G.cls, '#8b949e');
    cx2.globalAlpha = 1;
  }
  cx2.restore();
}
const $ = id => document.getElementById(id);
function slotLabel(s) { return s==='weaponL'?t('slot_wL') : s==='weaponR'?t('slot_wR') : s==='armor'?t('slot_arm') : t('slot_ama'); }
/* ---------------- enemy inspector (tooltip under the crosshair) ---------------- */
/* Locks the mob the crosshair is pointing at and shows its name, HP, DEF and its
   strong/weak elements. "strong" = the element it resists most (high resist → it
   shrugs that damage); "weak" = the element it is most vulnerable to (low resist). */
/* effective resist per element. phys/fire/cold live on the mob; the game deals
   volt (storm) damage but the config doesn't model a volt resist, so it reads 0. */
function mobResist(m) {
  return {
    phys: (m.res && m.res.phys) || 0,
    fire: (m.res && m.res.fire) || 0,
    cold: (m.res && m.res.cold) || 0,
    volt: 0
  };
}
function updateInspect() {
  const el = $('inspect');
  if (!G || G.over) { el.style.display = 'none'; return; }
  // candidate = the live mob closest to the crosshair, within its body + a small margin
  let best = null, bd = Infinity;
  const M = 26;
  for (const m of G.mobs) {
    if (m.dead) continue;
    const dd = d2(G.aim.x, G.aim.y, m.x, m.y);
    if (dd < (M + m.cr) * (M + m.cr) && dd < bd) { bd = dd; best = m; }
  }
  // sticky lock so the tooltip doesn't blink off when the body drifts a few px
  if (!best && G.inspectLock && !G.inspectLock.dead &&
      d2(G.aim.x, G.aim.y, G.inspectLock.x, G.inspectLock.y) < (M + G.inspectLock.cr + 20) ** 2)
    best = G.inspectLock;
  G.inspectLock = best || null;
  if (!best) { el.style.display = 'none'; return; }
  el.style.display = 'block';

  const m = best;
  // name + rarity chip
  $('inNm').textContent = m.boss ? t('boss_' + m.btype) : t('mob_' + m.rarity);
  const rar = $('inRar');
  const chipCol = m.boss ? (CFG.boss[m.btype] && CFG.boss[m.btype].col) : (CFG.mobs[m.rarity] && CFG.mobs[m.rarity].col);
  if (m.boss) { rar.textContent = t('mtier_boss'); rar.style.color = chipCol || '#ffd23f'; }
  else        { rar.textContent = t('mtier_' + m.rarity); rar.style.color = chipCol || '#dfe6f0'; }
  // hp + def
  $('inHpF').style.width = Math.max(0, 100 * m.hp / m.maxHp) + '%';
  $('inHp').textContent = Math.ceil(m.hp) + '/' + Math.ceil(m.maxHp);
  $('inDef').textContent = Math.round(m.armor * 100) / 100;   // armor is now fractional (tank factor) — tidy the readout
  $('inHpK').textContent = t('insp_hp');
  $('inDefK').textContent = t('insp_def');
  // strong / weak vs — from the resist profile (high resist = strong, low = weak)
  const res = mobResist(m);
  const sorted = ['phys','fire','cold','volt'].sort((a,b) => res[b] - res[a]);
  const pick = (el2) => t('el_' + el2) + ' ' + Math.round(res[el2]*100) + '%';
  $('inWeakK').textContent   = t('insp_weak');
  $('inStrongK').textContent = t('insp_strong');
  $('inWeak').textContent    = sorted.slice().reverse().slice(0,2).map(pick).join(' · ');
  $('inStrong').textContent  = sorted.slice(0,2).map(pick).join(' · ');
}

function hud() {
  const p = G.p;
  $('hpF').style.width = (100*p.hp/maxHp()) + '%';
  $('hpLab').textContent = t('hp')+' '+Math.ceil(p.hp)+'/'+maxHp();
  // next-wave button: hidden while a panel (upgrade/compare) is open or game over;
  // shows a live countdown while on cooldown, then the call-to-action
  const wb = $('waveNext');
  const busy = G.upOpen || G.cmpOpen || G.shopOpen;
  if (G.over || busy) {
    wb.style.display = 'none';
  } else {
    wb.style.display = 'block';
    const cooling = G.waveBtnCd > 0;
    wb.classList.toggle('cool', cooling);
    wb.textContent = cooling ? t('wave_next') + ' ' + Math.ceil(G.waveBtnCd) + 's' : t('wave_btn');
  }
  const need = XP_FOR(G.lvl);
  $('xpF').style.width = (100*G.xp/need) + '%';
  $('xpLab').textContent = t('xp')+' '+Math.floor(G.xp)+'/'+need;
  $('lvlTag').textContent = t('lvl')+' '+G.lvl +
    ' · ' + abName(0) + ' [1] · ' + abName(1) + ' [2] · ' + abName(2) + ' [3]';
  $('statL').innerHTML =
    '<b>'+t('lvl')+' '+G.lvl+'</b> · '+t('gold')+' <b style="color:#ffd23f">'+p.gold+'</b><br>' +
    t('pot')+' <b style="color:#7ee787">'+p.potions+'</b>/3 [Q] · '+clsName();
  $('statR').innerHTML =
    '<b style="color:#dfe6f0;font-size:15px">'+t('wave')+' '+G.wave+'</b> · '+
    '<span style="color:'+zoneHue()+'">'+t(ZONES[G.zone].key)+'</span> · '+t('kills')+' '+G.kills +
    (G.bosses ? ' · '+t('boss')+' '+G.bosses : '') +
    '<br>'+fmtT(G.t) + (G.paused && !G.upOpen ? ' · <span style="color:#ffd23f">'+t('pause_tag')+'</span>' : '');
  const order = ['weaponL','weaponR','armor','amulet'];
  for (const s of order) {
    const el = $('sl'+order.indexOf(s));
    const it = G.items[s];
    el.style.borderColor = it ? CFG.irColor[it.rar] : '#233047';
    el.innerHTML = '<b style="color:'+(it?CFG.irColor[it.rar]:'#dfe6f0')+'">'+slotLabel(s)+'</b>' +
      (it ? it.name + (it.statText ? '<br>'+it.statText : '') : '—');
    // (re)create the icon canvas + paint the item glyph (innerHTML wiped the old canvas)
    let ic = el.querySelector('canvas.slotIcon');
    if (!ic) {
      ic = document.createElement('canvas'); ic.width = 40; ic.height = 40; ic.className = 'slotIcon';
      el.insertBefore(ic, el.firstChild);
    }
    paintSlotIcon(el, s, it);
  }
  for (let i=0;i<3;i++) {
    const el = $('ab'+i);
    const A = G.ab[i], cd = el.querySelector('.cd');
    cd.style.display = A.cd > 0 ? 'flex' : 'none';
    if (A.cd > 0) cd.textContent = Math.ceil(A.cd);
  }
  // attribute panel
  $('aPts').textContent = G.attrPts;
  $('vSTR').textContent = G.attr.str;
  $('vDEX').textContent = G.attr.dex;
  $('vEND').textContent = G.attr.end;
  for (const k of ['bSTR','bDEX','bEND'])
    document.getElementById(k).classList.toggle('ready', G.attrPts > 0);
  $('attrHint').textContent = G.attrPts > 0 ? t('attr_hint') : '';
}
function mini() {
  const mc = $('mini').getContext('2d');
  const s = 140/WORLD.w;
  mc.clearRect(0,0,140,140);
  mc.fillStyle = 'rgba(21,29,48,.8)';
  for (const o of OBB) mc.fillRect(o.x*s, o.y*s, Math.max(2,o.w*s), Math.max(2,o.h*s));
  for (const m of G.mobs) {
    mc.fillStyle = CFG.mobs[m.rarity].col;
    mc.beginPath(); mc.arc(m.x*s, m.y*s, m.boss ? 4 : 2, 0, TAU); mc.fill();
  }
  mc.fillStyle = '#fff';
  for (const d of G.drops) mc.fillRect(d.x*s-1, d.y*s-1, 2, 2);
  mc.fillStyle = '#e6edf3';
  mc.beginPath(); mc.arc(G.p.x*s, G.p.y*s, 3, 0, TAU); mc.fill();
  if (G.cat.on) {
    mc.fillStyle = '#ffd23f';
    mc.beginPath(); mc.arc(G.cat.x*s, G.cat.y*s, 3, 0, TAU); mc.fill();
    mc.strokeStyle = '#ffd23f'; mc.lineWidth = 1;
    mc.strokeRect(G.cat.x*s-4, G.cat.y*s-4, 8, 8);
  }
  mc.strokeStyle = '#58a6ff'; mc.lineWidth = 1;
  mc.strokeRect(G.cam.x*s, G.cam.y*s, c.width*s, c.height*s);
}

/* ---------------- character sheet (C) ---------------- */
/* Live read-out of the player's stats for the current run. Every value is pulled
   from the same functions the combat code uses, so it always matches reality. */
function charKv(label, val, pos) {
  return '<div class="kv"><span>'+label+'</span><b'+(pos?' class="pos"':'')+'>'+val+'</b></div>';
}
function charBox(title, inner) {
  return '<div class="box"><h4>'+title+'</h4>'+inner+'</div>';
}
function renderCharSheet() {
  $('charTitle').textContent = t('char_title');
  const pct = x => Math.round(x*100) + '%';
  const w = clsWpn();
  const bolts = G.cls==='daggers' ? w.hits : G.cls==='crossbow' ? 2 : 1;
  const reach = w.reach ? Math.round(w.reach) : '∞';   // ranged classes fire unbounded projectiles
  const atkPerSec = (1 / wpnRate()).toFixed(2) + '/s';
  const ls = (G.up.ls>0 ? G.up.ls : 0) + lifestealPct();

  const combat = charBox(t('char_combat'),
    charKv(t('st_dmg'),    Math.round(wpnDmg())) +
    charKv(t('st_atkspd'), atkPerSec) +
    charKv(t('st_crit'),   pct(critChance()), true) +
    charKv(t('st_lifesteal'), pct(ls), true) +
    charKv(t('st_bolts'),  bolts + extraProj()) +
    charKv(t('st_reach'),  reach));

  const surv = charBox(t('char_surv'),
    charKv(t('st_hp'),   Math.round(maxHp())) +
    charKv(t('st_spd'),  Math.round(moveSpd())) +

  const elem = charBox(t('char_elem'),
    charKv(t('st_fire')+ ' '+t('st_dmg'), '+'+elFlat('fire'), true) +
    charKv(t('st_cold')+ ' '+t('st_dmg'), '+'+elFlat('cold'), true) +
    charKv(t('st_volt')+ ' '+t('st_dmg'), '+'+elFlat('volt'), true) +
    charKv(t('st_pen'),  pct(armorPen()), true) +
    charKv(t('st_gp'),   '+'+(Math.round((goldFindMult()-1)*100))+'%', true) +
    charKv(t('st_xp'),   '+'+(Math.round((xpGainMult()-1)*100))+'%', true) +
    charKv(t('st_ignite'), pct(igniteChance()), true));

  const attr = charBox(t('char_attr'),
    charKv(t('st_str'), G.attr.str) +
    charKv(t('st_dex'), G.attr.dex) +
    charKv(t('st_end'), G.attr.end) +
    charKv(t('st_pts'), G.attrPts, G.attrPts>0) +

  const res = charBox(t('char_res'),
    '<div style="font-size:10px;color:#58627a;margin-bottom:6px">'+t('res_note')+'</div>' +
    charKv(t('st_phys'),  '0%') +
    charKv(t('st_fire'),  '0%') +
    charKv(t('st_cold'),  '0%') +
    charKv(t('st_volt'),  '0%'));

  const run = charBox(t('char_run'),
    charKv(t('st_wave'),  G.wave) +
    charKv(t('st_kills'), G.kills) +
    charKv(t('st_gold'),  G.p.gold) +
    charKv(t('char_lvl'), G.lvl) +
    charKv('⏱', fmtT(G.t)));

  $('charWho').innerHTML =
    t('char_class')+': <b>' + clsName() + '</b> · '+t('char_lvl')+' '+G.lvl;
  $('charGrid').innerHTML = combat + surv + elem + attr + res + run;
}
function openCharSheet() {
  if (!G || G.over) return;
  renderCharSheet();
  G.charOpen = true; G.paused = true;
  $('char').style.display = 'flex';
}
function closeCharSheet() {
  if (!G || !G.charOpen) return;
  G.charOpen = false;
  G.paused = G.upOpen || G.cmpOpen || G.shopOpen;
  $('char').style.display = 'none';
}
function startRun(cls) {
  newRun(cls); ac();
  $('title').style.display = 'none';
  $('hudTop').style.display = 'flex';
  $('bottomCenter').style.display = 'flex';
  $('slots').style.display = 'flex';
  $('abs').style.display = 'flex';
  $('mini').style.display = 'block';
  $('end').style.display = 'none';
  document.getElementById('shop').style.display = 'none';
  document.getElementById('cmp').style.display = 'none';
}

/* ---------------- input ---------------- */
$('clDag').onclick  = ()=> startRun('daggers');
$('clXbow').onclick = ()=> startRun('crossbow');
$('clMag').onclick  = ()=> startRun('mage');
$('endAgain').onclick = ()=> startRun(G.cls);
$('endMenu').onclick = exitToMenu;
/* pause menu (ESC) — resume / back-to-menu / audio options */
$('pauseResume').onclick = ()=> { if (G && G.pauseMenu) closePauseMenu(); };
$('pauseMenu').onclick   = exitToMenu;
$('pauseMute').onclick   = ()=> { setAudio(audioMuted ? audioVol : 0, !audioMuted); refreshPauseMenu(); };
$('pauseVol').oninput    = e => { const v = (+e.target.value)/100; setAudio(v, false); if (master) master.gain.value = v; $('pauseMute').textContent='♪'; };
// clicking the dimmed backdrop (not the card) closes the pause menu
$('pause').onclick = e => { if (e.target.id === 'pause' && G && G.pauseMenu) closePauseMenu(); };
$('pause').onmousedown = e => { if (e.target.id !== 'pause') e.stopPropagation(); };
$('langBtn').onclick = ()=> { lang = lang==='en' ? 'pt' : 'en'; refreshTitleLang(); };
$('shopClose').onclick = () => { if (G && G.shopOpen) closeShop(); };
$('shopClose').onmousedown = e => e.stopPropagation();
$('cmpNew').onclick = () => resolveCmp(true);
$('cmpOld').onclick = () => resolveCmp(false);
$('cmpNew').onmousedown = e => e.stopPropagation();
$('cmpOld').onmousedown = e => e.stopPropagation();
/* character sheet (C) */
$('charClose').onclick = () => { if (G && G.charOpen) closeCharSheet(); };
$('charClose').onmousedown = e => e.stopPropagation();
$('char').onclick = e => { if (e.target.id === 'char' && G && G.charOpen) closeCharSheet(); };
$('char').onmousedown = e => { if (e.target.id !== 'char') e.stopPropagation(); };
document.getElementById('shop').onmousedown = e => e.stopPropagation(); // no canvas attack while trading
document.getElementById('cmp').onmousedown = e => e.stopPropagation();  // no canvas attack while comparing
$('waveNext').onclick = () => forceWave();
$('waveNext').onmousedown = e => e.stopPropagation();  // don't trigger attack-aim on the canvas
for (const k of ['bSTR','bDEX','bEND']) {
  const el = document.getElementById(k);
  el.onclick = () => { spendAttr(k==='bSTR'?'str':k==='bDEX'?'dex':'end'); };
  el.onmousedown = e => e.stopPropagation();  // don't trigger attack-aim on the canvas
}
addEventListener('keydown', e => {
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if (k==='a'||k==='ArrowLeft') key.a = true;
  if (k==='d'||k==='ArrowRight') key.d = true;
  if (k==='w'||k==='ArrowUp') key.w = true;
  if (k==='s'||k==='ArrowDown') key.s = true;
  if (k===' ') { EDGE.space = true; e.preventDefault(); }
  if (k==='q') EDGE.q = true;
  if (k==='f') EDGE.f = true;
  if (k==='1') EDGE.ab1 = true;
  if (k==='2') EDGE.ab2 = true;
  if (k==='3') EDGE.ab3 = true;
  if (k==='b' && G && !G.over) {
    if (G.shopOpen) closeShop();
    else if (shopAvailable()) openShop();
    else if (G.cat.on) addFloat(G.p.x, G.p.y-24, '…to Mog first…', '#8b949e');
  }
  if (k==='v' && G && !G.over && !G.shopOpen && !G.pauseMenu && !G.upOpen && !G.cmpOpen) forceWave();
  if (k==='c' && G && !G.over && !G.pauseMenu && !G.upOpen && !G.cmpOpen) {
    if (G.charOpen) closeCharSheet();
    else openCharSheet();
  }
  if (k==='Escape' && G && !G.over) {
    if (G.charOpen) closeCharSheet();
    else if (G.pauseMenu) closePauseMenu();                 // ESC closes the menu
    else if (G.shopOpen) closeShop();
    else if (!G.upOpen && !G.cmpOpen) openPauseMenu(); // ESC opens the menu
  }
  if (k==='t') { lang = lang==='en' ? 'pt' : 'en'; refreshTitleLang(); }
});
addEventListener('keyup', e => {
  const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
  if (k==='a'||k==='ArrowLeft') key.a = false;
  if (k==='d'||k==='ArrowRight') key.d = false;
  if (k==='w'||k==='ArrowUp') key.w = false;
  if (k==='s'||k==='ArrowDown') key.s = false;
});
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
addEventListener('mousedown', e => { if (e.button===0) { mouse.held = true; ac(); } });
addEventListener('mouseup',   e => { if (e.button===0) mouse.held = false; });

/* ---------------- loop ---------------- */
let last = performance.now();
/* preview the 3 hero billboards on the title screen (class cards) */
const heroPreviews = [
  { cv: $('clDagC'),  cls:'daggers'  },
  { cv: $('clXbowC'), cls:'crossbow' },
  { cv: $('clMagC'),  cls:'mage'     }
];
function drawHeroPreviews(tNow) {
  const pp = { r: 16 };
  for (const h of heroPreviews) {
    if (!h.cv) continue;
    const cx2 = h.cv.getContext('2d');
    cx2.clearRect(0,0,64,64);
    cx2.save(); cx2.translate(32, 40);          // anchor the hero's feet near the bottom
    const wob = -Math.PI/2 + Math.sin(tNow*0.0015)*0.5;   // slow sway
    cx2.rotate(wob);
    drawHero(cx2, h.cls, pp, 0, tNow*0.002);
    cx2.restore();
  }
}
function loop(now) {
  const dt = Math.min((now-last)/1000, .05);
  last = now;
  // hit-shake: regenerate the jitter once per frame so the scene shakes (no tearing)
  if (G && !G.paused && G.shake > 0) {
    G._shx = (Math.random()*2-1) * G.shake;
    G._shy = (Math.random()*2-1) * G.shake;
  } else if (G) { G._shx = 0; G._shy = 0; }
  if (G && !G.paused && !G.over) update(dt);
  if (G && G.over && !G.endShown) { G.endShown = true; showEnd(); }
  if (!G) drawHeroPreviews(now);               // title screen: animate the 3 hero previews
  render();
  updateInspect();                             // top-centre enemy tooltip
  requestAnimationFrame(loop);
}
refreshTitleLang();
requestAnimationFrame(loop);

/* ---------------- debug / testes ---------------- */
window.__rl = {
  get G(){ return G; }, get lang(){ return lang; }, setLang: l => { lang = l; refreshTitleLang(); },
  CFG, XP_FOR,
  startRun, spawnWave, addMobAt,
  grantXp: n => gainXp(n),
  forceBoss: ()=> addMobAt('lendario'),
  killAllMobs: ()=> { for (const m of G.mobs) hitMob(m, 1e9, false); },
  hurtPlayer: n => hurtPlayer(n),
  drop: (rar, slot) => { G.drops.push(makeDrop(G.p.x, G.p.y, rar, slot)); },
  dropPotion: () => { G.pots.push({ x:G.p.x, y:G.p.y, life:30, ph:0, dead:false }); },
  usePotion, ability,
  tick: (n, aimMobs) => {
    for (let i=0; i<n; i++) {
      if (aimMobs && G.mobs.length) { const m = G.mobs[0]; mouse.x = m.x - G.cam.x; mouse.y = m.y - G.cam.y; mouse.held = true; }
      update(1/60);
      if (G.over) break;
    }
  },
  mouse, makeDrop, weaponTier, wpnDmg, maxHp,
  openUp
};
window.addEventListener('error', e => { window.__err = (window.__err||'') + e.message + ' @' + e.lineno + '\n'; });
</script>
</body>
